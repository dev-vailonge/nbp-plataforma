<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>No Blank Page — Entrar</title>
<link href="assets/reset_0f9ee9f4f517.css" rel="stylesheet"/>
<link href="assets/theme_0669b57c8fb5.css" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
html, body {
  margin: 0;
  min-height: 100%;
  background: #181818;
  color: #FDFFEF;
  font-family: "TT Norms Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button, input { font: inherit; }

.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(24,24,24,0.86);
  border-bottom: 1px solid #C6C8BA22;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #FDFFEF;
}
.topbar-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: radial-gradient(circle at 30% 30%, #FDFFEF 0%, #C6C8BA 55%, #4B4C47 100%);
  box-shadow: 0 0 18px rgba(253,255,239,0.18);
}
.topbar-name {
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.topbar-login {
  display: inline-flex;
  padding: 10px 18px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: #FDFFEF;
  border: 1px solid #C6C8BA50;
  border-radius: 999px;
  transition: border-color 0.25s ease, background 0.25s ease;
}
.topbar-login:hover {
  border-color: #FDFFEF;
  background: rgba(253,255,239,0.05);
}

.auth {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 110px 24px 60px;
}
.auth-card {
  width: 100%;
  max-width: 440px;
  background: linear-gradient(160deg, rgba(253,255,239,0.04) 0%, rgba(253,255,239,0.09) 100%);
  border: 1px solid #C6C8BA40;
  border-radius: 20px;
  padding: 40px 32px 32px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 12px 60px rgba(0,0,0,0.35);
}
.auth-card h1 {
  margin: 0 0 10px;
  font-size: 1.7rem;
  font-weight: 300;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.auth-card h1 strong { font-weight: 700; }
.auth-card p {
  margin: 0 0 28px;
  color: #94968D;
  line-height: 1.6;
  font-size: 0.95rem;
}
.field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.field label {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #94968D;
}
.field input {
  width: 100%;
  box-sizing: border-box;
  padding: 13px 14px;
  border-radius: 12px;
  border: 1px solid #C6C8BA33;
  background: rgba(24,24,24,0.65);
  color: #FDFFEF;
  outline: none;
  transition: border-color 0.25s ease, box-shadow 0.25s ease;
}
.field input:focus {
  border-color: #FDFFEF;
  box-shadow: 0 0 0 3px rgba(253,255,239,0.08);
}
.auth-submit {
  width: 100%;
  margin-top: 10px;
  padding: 14px 20px;
  border: 1px solid #FDFFEF;
  border-radius: 999px;
  background: #FDFFEF;
  color: #181818;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform 0.25s ease, background 0.3s ease, color 0.3s ease;
}
.auth-submit:hover {
  transform: translateY(-1px);
  background: transparent;
  color: #FDFFEF;
}
.auth-alt {
  margin: 22px 0 0;
  text-align: center;
  color: #94968D;
  font-size: 0.9rem;
}
.auth-alt a { color: #FDFFEF; font-weight: 600; }
@media (max-width: 680px) {
  .topbar { padding: 12px 16px; }
  .topbar-name { display: none; }
  .auth-card { padding: 32px 22px 26px; }
}
</style>
</head>
<body>
<header class="topbar">
  <a class="topbar-brand" href="index2.html" aria-label="No Blank Page">
    <span class="topbar-mark" aria-hidden="true"></span>
    <span class="topbar-name">No Blank Page</span>
  </a>
  <a class="topbar-login" href="cadastro.html">Criar conta</a>
</header>

<main class="auth">
  <form class="auth-card" action="platform.html" method="get">
    <h1>Entrar no <strong>ecossistema</strong></h1>
    <p>Continue a comunidade, as tutorias e o acompanhamento — crescimento, finanças, IA e estratégia no mesmo sítio.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="voce@negocio.com"/>
    </div>
    <div class="field">
      <label for="password">Palavra-passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"/>
    </div>
    <button class="auth-submit" type="submit">Entrar</button>
    <p class="auth-alt">Ainda não tem conta? <a href="cadastro.html">Criar conta</a></p>
  </form>
</main>
</body>
</html>
