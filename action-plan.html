<style>
:root {
  --bg: #151515;
  --bg-surface: #1C1C1C;
  --bg-card: #181818;
  --bg-elev: #222222;
  --border: #C6C8BA1F;
  --border-strong: #C6C8BA33;
  --text: #FDFFEF;
  --text-muted: #94968D;
  --text-subtle: #6B6C63;
  --sage: #C6C8BA;
  --sidebar-w: 244px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "TT Norms Pro", -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; }

.app { display: flex; min-height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 22px 14px 18px;
  z-index: 10;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 18px;
  margin-bottom: 6px;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: #2A2926;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-name {
  font-size: 1rem; font-weight: 500;
  letter-spacing: 0.07em;
  color: var(--text);
}
.sidebar-profile {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  border: 1px solid var(--border);
  background: rgba(253, 255, 239, 0.015);
  border-radius: 12px;
  margin-bottom: 22px;
  transition: border-color 0.25s ease, background 0.25s ease;
  cursor: pointer;
}
.sidebar-profile:hover {
  border-color: var(--border-strong);
  background: rgba(253, 255, 239, 0.04);
}
.profile-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #C6C8BA 0%, #4B4C47 100%);
  color: #181818;
  font-weight: 700; font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(253, 255, 239, 0.15);
}
.profile-info { min-width: 0; flex: 1; }
.profile-name {
  font-size: 0.88rem; font-weight: 600;
  color: var(--text);
  line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.profile-plan {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.66rem; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 3px;
}
.profile-plan::before {
  content: ""; width: 5px; height: 5px;
  border-radius: 50%;
  background: #C6C8BA;
  box-shadow: 0 0 6px rgba(198, 200, 186, 0.7);
}
.sidebar-label {
  font-size: 0.64rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-subtle);
  padding: 0 12px;
  margin: 4px 0 10px;
}
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--text-muted);
  font-size: 0.92rem; font-weight: 500;
  cursor: pointer;
  position: relative;
  transition: color 0.2s ease, background 0.2s ease;
}
.nav-item i { width: 18px; font-size: 16px; text-align: center; color: inherit; opacity: 0.85; }
.nav-item:hover { color: var(--text); background: rgba(253, 255, 239, 0.04); }
.nav-item.active { color: var(--text); background: rgba(253, 255, 239, 0.06); }
.nav-item.active::before {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 18px;
  border-radius: 2px;
  background: var(--text);
  box-shadow: 0 0 10px rgba(253, 255, 239, 0.6);
}
.sidebar-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}

/* ── Main ── */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  padding: 28px 40px 80px;
  min-height: 100vh;
  max-width: 1180px;
}
.topbar {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 26px;
}
.topbar-title { font-size: 1.4rem; font-weight: 600; margin: 0; color: var(--text); }
.topbar-title small {
  display: block;
  font-size: 0.8rem; font-weight: 400;
  color: var(--text-muted);
  margin-top: 2px;
}
.topbar-icon-btn {
  width: 38px; height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-muted);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}
.topbar-icon-btn.notif { margin-left: auto; }
.topbar-icon-btn:hover {
  color: var(--text);
  border-color: var(--border-strong);
  background: var(--bg-elev);
}
.mobile-toggle { display: none; }

/* ── Challenge header ── */
.challenge-head {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 24px 26px 26px;
  margin: 0 0 30px;
}
.panel-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 26px;
}
.ch-kicker {
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-subtle);
  margin-bottom: 7px;
}
.ch-title {
  margin: 0 0 6px;
  font-size: 1.4rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text);
}
.ch-sub { margin: 0; color: var(--text-muted); font-size: 0.88rem; max-width: 60ch; }
.panel-flag {
  text-align: right;
  font-size: 0.82rem;
  color: var(--text-muted);
  flex-shrink: 0;
}
.panel-flag b { color: var(--text); font-weight: 700; }
.panel-flag .panel-flag-target { color: var(--sage); }

/* ── Journey timeline (same as home) ── */
.journey { position: relative; }
.journey-scroll {
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}
.journey-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
.journey-track {
  position: relative;
  display: grid;
  grid-template-columns: repeat(9, minmax(0, 1fr));
  align-items: start;
}
.journey-line {
  position: absolute;
  top: 24px;
  left: 5.5%;
  right: 5.5%;
  height: 2px;
  background: var(--border-strong);
  border-radius: 2px;
  z-index: 0;
}
.journey-fill {
  position: absolute;
  top: 24px;
  left: 5.5%;
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, #4B4C47, #C6C8BA, #FDFFEF);
  border-radius: 2px;
  box-shadow: 0 0 14px rgba(198,200,186,0.4);
  transition: width 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  z-index: 1;
}
.step {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 4px;
  background: none;
  border: 0;
  padding: 0 6px;
  min-width: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
}
.step.locked { cursor: not-allowed; }
.step-figure {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.step-node {
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.4s ease, filter 0.4s ease;
}
.step-mark {
  width: 22px;
  height: 22px;
  display: block;
}
.step-mark-sq { fill: #C6CABE; transition: fill 0.25s ease; }
.step-mark-dot { fill: #2A2926; transition: fill 0.25s ease; }
.step.done .step-node {
  filter: drop-shadow(0 0 8px rgba(198, 200, 186, 0.35));
}
.step.current .step-node {
  width: 26px;
  height: 26px;
  animation: nodePulse 3s ease-in-out infinite;
}
.step.current .step-mark {
  width: 26px;
  height: 26px;
}
.step.current .step-mark-sq { fill: #FDFFEF; }
.step.current .step-mark-dot { fill: #2A2926; }
.step.locked .step-mark-sq { fill: #4B4C47; }
.step.locked .step-mark-dot { fill: #232320; }
.step.locked .step-node { opacity: 0.85; }
@keyframes nodePulse {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(253,255,239,0.25)); transform: scale(1); }
  50% { filter: drop-shadow(0 0 14px rgba(253,255,239,0.45)); transform: scale(1.06); }
}
.step:hover,
.step:focus,
.step:focus-visible {
  background: transparent !important;
  color: inherit;
  outline: none;
  box-shadow: none;
}
.step.selected .step-node {
  filter: drop-shadow(0 0 10px rgba(253,255,239,0.45));
}
.step.selected .step-mark-sq { fill: #FDFFEF; }
.step-name {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text);
  margin-top: 6px;
  width: 100%;
  max-width: 100%;
  line-height: 1.25;
  white-space: normal;
  overflow-wrap: break-word;
  hyphens: auto;
}
.step.locked .step-name { color: var(--text-subtle); font-weight: 500; }
.step-sub {
  font-size: 0.72rem;
  color: var(--text-subtle);
  width: 100%;
  line-height: 1.25;
  white-space: normal;
}
.step.current .step-sub { color: var(--sage); font-weight: 700; }
.step.selected .step-name { text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 4px; }

/* ── Month plan: metrics + kanban ── */
.month-plan { margin-top: 8px; max-width: 1180px; }
.month-nav {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 14px;
}
.month-nav-title { margin: 0; font-size: 1.15rem; font-weight: 600; color: var(--text); }
.month-nav-title span {
  display: block; margin-top: 3px; font-size: 0.84rem; font-weight: 400;
  color: var(--text-muted); text-transform: lowercase;
}
.year-nav {
  display: inline-flex; align-items: center; gap: 6px;
  color: var(--text-muted); font-size: 0.88rem; font-variant-numeric: tabular-nums;
}
.year-nav button {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-surface); color: var(--text-muted); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.year-nav button:hover { color: var(--text); border-color: var(--border-strong); }
.year-nav strong { color: var(--text); font-weight: 600; min-width: 42px; text-align: center; }
.month-pills {
  display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px;
  margin-bottom: 26px; scrollbar-width: none;
}
.month-pills::-webkit-scrollbar { display: none; }
.month-pill {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border);
  background: transparent; color: var(--text-muted); font-size: 0.82rem; cursor: pointer;
  transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.month-pill:hover { color: var(--text); border-color: var(--border-strong); }
.month-pill.active {
  background: var(--bg-elev); border-color: var(--sage); color: var(--text); font-weight: 600;
}
.month-pill .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-subtle); }
.month-pill.active .dot { background: var(--sage); }
.section-head {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
}
.section-head h3 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--text); }
.section-head .hint { font-size: 0.82rem; color: var(--text-muted); }
.section-head .count {
  margin-left: auto; font-size: 0.82rem; color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.metrics-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px; margin-bottom: 30px;
}
.metric-card {
  border: 1px solid var(--border); background: var(--bg-surface);
  border-radius: 12px; padding: 14px 16px;
}
.metric-label { font-size: 0.74rem; color: var(--text-muted); margin-bottom: 8px; }
.metric-value {
  font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em;
  color: var(--text); line-height: 1.15; font-variant-numeric: tabular-nums;
}
.metric-value .pre { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); margin-right: 3px; }
.metric-delta { margin-top: 7px; font-size: 0.74rem; font-variant-numeric: tabular-nums; color: var(--text-subtle); }
.metric-delta.good { color: #6BC4A0; }
.metric-delta.bad { color: #E87070; }
.metric-before { margin: 2px 0 0; font-size: 0.7rem; color: var(--text-subtle); }
.obj-progress {
  height: 4px; background: var(--bg-elev); border-radius: 999px; overflow: hidden; margin-bottom: 14px;
}
.obj-progress > span {
  display: block; height: 100%;
  background: linear-gradient(90deg, #8A8B82, #C6C8BA);
  border-radius: inherit; transition: width 0.35s ease;
}
.kanban {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px; align-items: start;
}
.kcol {
  min-height: 120px; border-radius: 12px; padding: 2px;
  transition: background 0.15s ease, outline-color 0.15s ease;
}
.kcol.over { background: rgba(198,200,186,0.04); outline: 1px dashed var(--border-strong); outline-offset: 2px; }
.kcol-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.kpill {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 4px 11px; border-radius: 999px; font-size: 0.78rem; font-weight: 500;
}
.kpill .kdot { width: 7px; height: 7px; border-radius: 50%; }
.kpill.none { background: rgba(198,200,186,0.08); color: var(--text-muted); }
.kpill.none .kdot { background: #8A8B82; }
.kpill.todo { background: rgba(93,169,240,0.12); color: #97C3EC; }
.kpill.todo .kdot { background: #5DA9F0; }
.kpill.done { background: rgba(63,190,147,0.12); color: #63CBA6; }
.kpill.done .kdot { background: #3FBE93; }
.kcol-count { margin-left: auto; font-size: 0.74rem; color: var(--text-subtle); font-variant-numeric: tabular-nums; }
.kcard {
  border: 1px solid var(--border); background: var(--bg-surface);
  border-radius: 10px; margin-bottom: 8px; cursor: grab;
  transition: border-color 0.15s ease, opacity 0.15s ease;
}
.kcard:hover { border-color: var(--border-strong); }
.kcard.drag { opacity: 0.45; }
.kcard-row { display: flex; align-items: flex-start; gap: 2px; }
.kcard-toggle, .kcard-del {
  border: none; background: none; color: var(--text-subtle); cursor: pointer;
  padding: 12px 8px; flex-shrink: 0;
}
.kcard-toggle { padding-left: 10px; }
.kcard-toggle.done { color: #3FBE93; }
.kcard-del { padding-right: 10px; }
.kcard-del:hover { color: var(--text); }
.kcard-text { flex: 1; min-width: 0; padding: 12px 4px 10px; font-size: 0.88rem; line-height: 1.5; color: var(--text); }
.kcard-text.struck { color: var(--text-subtle); text-decoration: line-through; }
.kcard-lesson {
  display: flex; align-items: center; gap: 8px; width: calc(100% - 44px);
  margin: 0 10px 10px 34px; border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 8px 6px 6px; background: transparent; text-align: left; cursor: pointer; color: inherit;
}
.kcard-lesson:hover { border-color: var(--border-strong); background: rgba(253,255,239,0.02); }
.kcard-lesson-thumb {
  width: 34px; height: 22px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 10px;
}
.kcard-lesson-title {
  display: block; font-size: 0.74rem; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kcard-lesson-dur { display: block; font-size: 0.66rem; color: var(--text-subtle); }
.kcard-link {
  display: inline-flex; align-items: center; gap: 6px; margin: 0 10px 10px 34px;
  border: none; background: none; padding: 0; color: var(--text-subtle); font-size: 0.74rem; cursor: pointer;
}
.kcard-link:hover { color: var(--text-muted); }
.kcol-empty { margin: 0; padding: 16px 6px; font-size: 0.8rem; color: var(--text-subtle); }
.btn-add-obj {
  width: 100%; display: flex; align-items: center; gap: 8px; padding: 10px 4px;
  border: none; background: none; color: var(--text-muted); font-size: 0.88rem; cursor: pointer; text-align: left;
}
.btn-add-obj:hover { color: var(--text); }
.add-obj-box {
  border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 4px; background: var(--bg-surface);
}
.add-obj-box input, .add-obj-box select {
  width: 100%; height: 36px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 8px;
  padding: 0 10px; background: var(--bg-elev); color: var(--text); font: inherit; font-size: 0.86rem; outline: none;
}
.add-obj-box input:focus, .add-obj-box select:focus { border-color: var(--border-strong); }
.add-obj-box label { display: block; font-size: 0.72rem; color: var(--text-muted); margin-bottom: 5px; }
.add-obj-actions { display: flex; gap: 8px; }
.add-obj-actions .save {
  flex: 1; border: 1px solid var(--border-strong); background: var(--text); color: #181818;
  border-radius: 8px; padding: 8px; font-size: 0.82rem; font-weight: 600; cursor: pointer;
}
.add-obj-actions .cancel { border: none; background: none; color: var(--text-muted); font-size: 0.82rem; padding: 8px 10px; cursor: pointer; }
.add-obj-error { margin: 0 0 8px; font-size: 0.76rem; color: #E87070; }
.month-empty {
  border: 1px dashed var(--border-strong); border-radius: 12px; padding: 40px 16px; text-align: center; color: var(--text-muted);
}
.month-empty p { margin: 0 0 6px; color: var(--text); font-weight: 600; }
.month-empty button {
  margin-top: 14px; border: 1px solid var(--border-strong); background: var(--bg-elev); color: var(--text);
  border-radius: 8px; padding: 8px 14px; font-size: 0.86rem; cursor: pointer;
}


/* ── Quadro / whiteboard ── */
.quadro {
  margin-top: 34px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.quadro-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.quadro-head h3 { margin: 0; font-size: 1rem; font-weight: 600; color: var(--text); }
.quadro-head p { margin: 4px 0 0; font-size: 0.82rem; color: var(--text-muted); }
.quadro-saved {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 0.8rem; color: var(--text-muted);
}
.quadro-saved i { color: #6BC4A0; }
.quadro-tools {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  margin-bottom: 12px;
}
.fr {
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  min-width: 34px; min-height: 34px;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
}
.fr:hover { border-color: var(--border-strong); color: var(--text); }
.fr.on {
  background: var(--sage);
  color: #181818;
  border-color: var(--sage);
}

  var PAL = ["#1C1C1A", "#185FA5", "#0F6E56", "#993C1D", "#993556", "#3C3489"];

  function rnd(s0) {

  }
  function lm(x1, y1, x2, y2, r) {
    var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy) || 1;
    var nx = -dy / L, ny = dx / L, d = "";
    for (var k = 0; k < 2; k++) {

        }
        d += "M" + p[0][0] + " " + p[0][1];
        for (var i2 = 1; i2 < p.length; i2++) d += " L" + p[i2][0] + " " + p[i2][1];

        if (f.t === "txt") {
          return '<text x="' + f.x + '" y="' + f.y + '" fill="' + K + '" style="font-family:Bradley Hand,Segoe Script,Comic Sans MS,cursive;font-size:22px">' +
            esc(f.txt) + "</text>";
        }
        return '<path d="' + caminho(f) + '" stroke="' + K + '" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
      }).join("") +
      (sel ? (function () {
        var b = caixa(sel);
        return '<rect x="' + (b.x - 6) + '" y="' + (b.y - 6) + '" width="' + (b.w + 12) + '" height="' + (b.h + 12) +
          '" fill="none" stroke="#5DA9F0" stroke-width="' + (1 / v.z) + '" stroke-dasharray="' + (4 / v.z) + " " + (3 / v.z) + '" rx="4"/>';
      })() : "") +
      "</g>";

    var cores = document.getElementById("cores");
    if (cores) {
      cores.innerHTML = PAL.map(function (c, i) {
        return '<button type="button" class="cr" data-c="' + i + '" aria-label="Cor ' + (i + 1) + '" style="background:' + c +
          ";border:" + (cor === i ? "2px solid #1C1C1A" : "0.5px solid #DCDAD2") + '"></button>';
      }).join("");
      cores.querySelectorAll(".cr").forEach(function (b) {
        b.onclick = function () { cor = +b.getAttribute("data-c"); if (sel) sel.c = cor; pintaTela(); };
      });
    }
    document.querySelectorAll(".fr[data-f]").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-f") === fer);
    });
    var ap = document.getElementById("apagar");
    if (ap) ap.disabled = !sel;
    var zl = document.getElementById("zl");
    if (zl) zl.textContent = Math.round(v.z * 100) + "%";
    tela.style.cursor = fer === "pan" ? (pan ? "grabbing" : "grab") : (fer === "sel" ? "default" : (fer === "txt" ? "text" : "crosshair"));
    var dicat = document.getElementById("dicat");
    if (dicat) {
      dicat.textContent = fer === "pan"
        ? "Arrasta para andar pelo mapa. Ctrl + roda faz zoom."
        : (fer === "txt"
          ? "Clica onde queres escrever e carrega Enter."
          : (fer === "sel" ? "Clica numa forma para a arrastar." : "Arrasta na tela para desenhar."));
    }
  }

  function ligaTela() {
    var tela = document.getElementById("tela");
    if (!tela) return;
    var d = D[pk(py, pm)];
    if (!d.tela) d.tela = [];

    function ec(e) {
      var r = tela.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function mu(e) {
      var v = V(), s = ec(e);
      return { x: (s.x - v.ox) / v.z, y: (s.y - v.oy) / v.z };
    }
    function escrever(x, y, ex) {
      var v = V();
      editando = true;
      var inp = document.createElement("input");
      inp.id = "cx";
      inp.setAttribute("aria-label", "Texto");
      inp.value = ex ? ex.txt : "";
      inp.style.left = (x * v.z + v.ox) + "px";
      inp.style.top = (y * v.z + v.oy - 22 * v.z) + "px";
      inp.style.fontSize = (22 * v.z) + "px";
      inp.style.width = (220 * v.z) + "px";
      inp.style.color = PAL[ex ? ex.c : cor];
      tela.appendChild(inp);
      setTimeout(function () { inp.focus(); inp.select(); }, 0);
      var f2 = false;
      function fim(g) {
        if (f2) return;
        f2 = true; editando = false;
        var val = inp.value.trim();
        if (g && val) {
          if (ex) ex.txt = val;
          else d.tela.push({ t: "txt", x: x, y: y, txt: val, c: cor, s: 1 });
        }
        inp.remove();
        pintaTela();
      }
      inp.onkeydown = function (e) {
        e.stopPropagation();
        if (e.key === "Enter") fim(true);
        if (e.key === "Escape") fim(false);
      };
      inp.onblur = function () { fim(true); };
    }

    tela.onpointerdown = function (e) {
      if (editando) return;
      if (fer === "pan" || e.button === 1) {
        var v = V(), s = ec(e);
        pan = { sx: s.x, sy: s.y, ox: v.ox, oy: v.oy };
        tela.setPointerCapture(e.pointerId);
        pintaTela();
        return;
      }
      var p = mu(e);
      if (fer === "txt") {
        e.preventDefault();
        for (var k = d.tela.length - 1; k >= 0; k--) if (d.tela[k].t === "txt") {
          var bb = caixa(d.tela[k]);
          if (p.x >= bb.x && p.x <= bb.x + bb.w && p.y >= bb.y && p.y <= bb.y + bb.h) {
            escrever(d.tela[k].x, d.tela[k].y, d.tela[k]); return;
          }
        }
        escrever(p.x, p.y, null); return;
      }
      if (fer === "sel") {
        sel = null;
        for (var i = d.tela.length - 1; i >= 0; i--) {
          var b = caixa(d.tela[i]);
          if (p.x >= b.x - 8 && p.x <= b.x + b.w + 8 && p.y >= b.y - 8 && p.y <= b.y + b.h + 8) {
            sel = d.tela[i]; break;
          }
        }
        if (sel) { mover = { ox: p.x, oy: p.y }; tela.setPointerCapture(e.pointerId); }
        pintaTela(); return;
      }
      novo = { t: fer, x: p.x, y: p.y, w: 0, h: 0, c: cor, s: Math.floor(Math.random() * 900) + 1, pts: [[p.x, p.y]] };
      d.tela.push(novo);
      tela.setPointerCapture(e.pointerId);
    };
    tela.onpointermove = function (e) {
      if (editando) return;
      if (pan) {
        var v = V(), s = ec(e);
        v.ox = pan.ox + (s.x - pan.sx);
        v.oy = pan.oy + (s.y - pan.sy);
        pintaTela(); return;
      }
      var p = mu(e);
      if (mover && sel) {
        var dx = p.x - mover.ox, dy = p.y - mover.oy;
        if (sel.t === "lap") sel.pts = sel.pts.map(function (q) { return [q[0] + dx, q[1] + dy]; });
        else { sel.x += dx; sel.y += dy; }
        mover.ox = p.x; mover.oy = p.y; pintaTela(); return;
      }
      if (!novo) return;
      if (novo.t === "lap") novo.pts.push([p.x, p.y]);
      else { novo.w = p.x - novo.x; novo.h = p.y - novo.y; }
      pintaTela();
    };
    tela.onpointerup = function () {
      if (editando) return;
      if (novo) {
        var b = caixa(novo);
        if (novo.t !== "lap" && b.w < 4 && b.h < 4) d.tela.pop();
        else if (novo.t === "lap" && novo.pts.length < 3) d.tela.pop();
        novo = null;
      }
      mover = null; pan = null; pintaTela();
    };
    tela.onwheel = null;
    tela.addEventListener("wheel", function (e) {
      e.preventDefault();
      var v = V();
      if (e.ctrlKey || e.metaKey) {
        var r = tela.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top;
        var nz = Math.max(0.3, Math.min(2.5, v.z * (e.deltaY < 0 ? 1.08 : 0.93)));
        v.ox = sx - (sx - v.ox) * (nz / v.z);
        v.oy = sy - (sy - v.oy) * (nz / v.z);
        v.z = nz;
      } else { v.ox -= e.deltaX; v.oy -= e.deltaY; }
      pintaTela();
    }, { passive: false });

    document.querySelectorAll(".fr[data-f]").forEach(function (b) {
      b.onclick = function () { fer = b.getAttribute("data-f"); sel = null; pintaTela(); };
    });
    document.getElementById("apagar").onclick = function () {
      if (!sel) return;
      d.tela = d.tela.filter(function (f) { return f !== sel; });
      sel = null; pintaTela();
    };
    document.getElementById("limpar").onclick = function () { d.tela = []; sel = null; pintaTela(); };
    document.getElementById("exp").onclick = function () {
      telaGrande = !telaGrande; sel = null; render();
      var t2 = document.getElementById("tela");
      if (t2) t2.scrollIntoView({ behavior: "smooth", block: telaGrande ? "start" : "nearest" });
    };
    document.getElementById("zm").onclick = function () { var v = V(); v.z = Math.max(0.3, v.z * 0.85); pintaTela(); };
    document.getElementById("zp").onclick = function () { var v = V(); v.z = Math.min(2.5, v.z * 1.18); pintaTela(); };
    document.getElementById("ct").onclick = function () {
      var v = V();
      if (!d.tela.length) { v.ox = 0; v.oy = 0; v.z = 1; pintaTela(); return; }
      var bs = d.tela.map(caixa);
      var x1 = Math.min.apply(null, bs.map(function (b) { return b.x; }));
      var y1 = Math.min.apply(null, bs.map(function (b) { return b.y; }));
      var x2 = Math.max.apply(null, bs.map(function (b) { return b.x + b.w; }));
      var y2 = Math.max.apply(null, bs.map(function (b) { return b.y + b.h; }));
      var W = tela.clientWidth, H = tela.clientHeight;
      v.z = Math.max(0.3, Math.min(1.6, Math.min((W - 60) / (x2 - x1 || 1), (H - 60) / (y2 - y1 || 1))));
      v.ox = W / 2 - ((x1 + x2) / 2) * v.z;
      v.oy = H / 2 - ((y1 + y2) / 2) * v.z;
      pintaTela();
    };
  }


  var py = 2026, pm = 7;
  var aberto = false, erro = "", novaAula = "", ligarEm = null;

  var monthLabel = document.getElementById("monthLabel");
  var yearLabel = document.getElementById("yearLabel");
  var monthPills = document.getElementById("monthPills");
  var monthBody = document.getElementById("monthBody");

  function renderPills() {
    monthPills.innerHTML = MAB.map(function (nm, i) {
      var on = i === pm;
      var tem = !!D[pk(py, i)];
      return '<button type="button" class="month-pill' + (on ? " active" : "") + '" data-m="' + i + '">' +
        nm + (tem ? '<span class="dot" aria-hidden="true"></span>' : "") +
      "</button>";
    }).join("");
    monthPills.querySelectorAll(".month-pill").forEach(function (b) {
      b.addEventListener("click", function () {
        pm = +b.getAttribute("data-m");
        aberto = false; erro = ""; ligarEm = null;
        render();
      });
    });
  }

  document.getElementById("yearPrev").addEventListener("click", function () {
    py--; aberto = false; erro = ""; ligarEm = null; render();
  });
  document.getElementById("yearNext").addEventListener("click", function () {
    py++; aberto = false; erro = ""; ligarEm = null; render();
  });

  function opcoesAula(sel) {
    return '<option value="">Sem aula associada</option>' + AULAS.map(function (a) {
      return '<option value="' + a.id + '"' + (sel === a.id ? " selected" : "") + ">" +
        esc(a.t) + " · " + a.d + "</option>";
    }).join("");
  }

  function render() {
    yearLabel.textContent = String(py);
    monthLabel.textContent = MES[pm] + " de " + py;
    renderPills();

    var k = pk(py, pm);
    var d = D[k];
    var ant = D[ppv(py, pm)];

    if (!d) {
      monthBody.innerHTML =
        '<div class="month-empty">' +
          "<p>Ainda não há nada em " + MES[pm] + "</p>" +
          "<span>Regista os números, define os objetivos e avança no plano.</span><br/>" +
          '<button type="button" id="startMonth">Começar ' + MES[pm] + "</button>" +
        "</div>";
      var btn = document.getElementById("startMonth");
      if (btn) btn.onclick = function () {
        D[k] = {
          met: { mrr: "", rec: "", nov: "", act: "", chu: "", lea: "" },
          obj: [],
          desafio: {
            title: "Novo desafio de " + MES[pm],
            sub: "Define as etapas deste mês com o mentor.",
            flagMain: "Em breve",
            flagPrefix: "foco",
            flagTarget: "a definir",
            fill: "0%",
            stages: [
              { name: "Início", status: "current", sub: "agora" },
              { name: "Etapa 2", status: "locked", sub: "—" },
              { name: "Etapa 3", status: "locked", sub: "—" },
              { name: "Etapa 4", status: "locked", sub: "—" },
              { name: "Etapa 5", status: "locked", sub: "—" },
              { name: "Etapa 6", status: "locked", sub: "—" },
              { name: "Etapa 7", status: "locked", sub: "—" },
              { name: "Etapa 8", status: "locked", sub: "—" },
              { name: "Etapa 9", status: "locked", sub: "—" }
            ]
          },
          tela: [],
          v: { ox: 0, oy: 0, z: 1 }
        };
        render();
      };
      return;
    }

    var metrics =
      '<div class="section-head"><h3>Números de ' + MES[pm] + "</h3>" +
      (ant ? '<span class="hint">comparado com ' + MES[(pm + 11) % 12] + "</span>" : "") +
      "</div>" +
      '<div class="metrics-grid">' +
      CAMPOS.map(function (f) {
        var v = d.met[f.k];
        var pa = ant ? ant.met[f.k] : null;
        var dl = null;
        if (v !== "" && pa != null && pa !== "" && Number(pa) !== 0) {
          dl = ((Number(v) - Number(pa)) / Number(pa)) * 100;
        }
        var bom = dl === null ? null : (f.up ? dl > 0 : dl < 0);
        var cls = dl === null || Math.abs(dl) < 0.5 ? "" : (bom ? " good" : " bad");
        var st = dl === null ? "" : (Math.abs(dl) < 0.5 ? "— " : (dl > 0 ? "↑ " : "↓ "));
        var delta = dl === null ? "" : st + Math.abs(dl).toFixed(1) + "%";
        return '<div class="metric-card">' +
          '<div class="metric-label">' + esc(f.lb) + "</div>" +
          '<div class="metric-value">' +
            (f.pre ? '<span class="pre">' + f.pre + "</span>" : "") +
            (v === "" || v == null ? "—" : Number(v).toLocaleString("pt-PT", {
              minimumFractionDigits: f.dec, maximumFractionDigits: f.dec
            })) +
            (f.suf || "") +
          "</div>" +
          '<div class="metric-delta' + cls + '">' + delta + "</div>" +
          (pa != null && pa !== "" ? '<p class="metric-before">antes ' + fmt(pa, f) + "</p>" : "") +
        "</div>";
      }).join("") +
      "</div>";

    var doneN = d.obj.filter(function (o) { return o.s === "done"; }).length;
    var pct = d.obj.length ? Math.round((doneN / d.obj.length) * 100) : 0;

    var kanban =
      '<div class="section-head"><h3>Objetivos de ' + MES[pm] + "</h3>" +
      '<span class="count">' + doneN + "/" + d.obj.length + "</span></div>" +
      '<div class="obj-progress" aria-hidden="true"><span style="width:' + pct + '%"></span></div>' +
      '<div class="kanban">' +
      COLS.map(function (c) {
        var items = d.obj.filter(function (o) { return o.s === c.s; });
        var add = "";
        if (c.s === "none") {
          add = aberto
            ? '<div class="add-obj-box">' +
                '<input id="newObj" type="text" placeholder="Novo objetivo" aria-label="Novo objetivo"/>' +
                '<label for="newAula">Aula para rever</label>' +
                '<select id="newAula">' + opcoesAula(novaAula) + "</select>" +
                (erro ? '<p class="add-obj-error">' + esc(erro) + "</p>" : "") +
                '<div class="add-obj-actions">' +
                  '<button type="button" class="save" id="saveObj">Guardar</button>' +
                  '<button type="button" class="cancel" id="cancelObj">Cancelar</button>' +
                "</div></div>"
            : '<button type="button" class="btn-add-obj" id="openAdd"><i class="fa-solid fa-plus"></i> Objetivo</button>';
        }
        return '<div class="kcol" data-s="' + c.s + '">' +
          '<div class="kcol-head">' +
            '<span class="kpill ' + c.s + '"><span class="kdot"></span>' + c.lb + "</span>" +
            '<span class="kcol-count">' + items.length + "</span>" +
          "</div>" +
          items.map(function (o) {
            var i = d.obj.indexOf(o);
            var dn = o.s === "done";
            var au = o.a ? aula(o.a) : null;
            return '<div class="kcard" draggable="true" data-i="' + i + '">' +
              '<div class="kcard-row">' +
                '<button type="button" class="kcard-toggle' + (dn ? " done" : "") + '" data-toggle="' + i + '" aria-label="' + (dn ? "Reabrir" : "Concluir") + '">' +
                  '<i class="fa-' + (dn ? "solid fa-circle-check" : "regular fa-circle") + '"></i>' +
                "</button>" +
                '<span class="kcard-text' + (dn ? " struck" : "") + '">' + esc(o.t) + "</span>" +
                '<button type="button" class="kcard-del" data-del="' + i + '" aria-label="Remover"><i class="fa-solid fa-xmark"></i></button>' +
              "</div>" +
              (ligarEm === i
                ? '<div style="padding:0 10px 10px 34px"><select class="selAula" data-i="' + i + '" aria-label="Aula associada" style="width:100%;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--bg-elev);color:var(--text);font:inherit;font-size:0.8rem;padding:0 8px">' +
                    opcoesAula(o.a) + "</select></div>"
                : au
                  ? '<button type="button" class="kcard-lesson" data-lesson="' + au.id + '">' +
                      '<span class="kcard-lesson-thumb" style="background:' + au.c + ';color:' + au.l + '"><i class="fa-solid fa-play"></i></span>' +
                      '<span style="min-width:0;flex:1">' +
                        '<span class="kcard-lesson-title">' + esc(au.t) + "</span>" +
                        '<span class="kcard-lesson-dur">' + esc(au.d) + "</span>" +
                      "</span></button>"
                  : '<button type="button" class="kcard-link" data-link="' + i + '"><i class="fa-solid fa-link"></i> associar aula</button>') +
            "</div>";
          }).join("") +
          (items.length === 0 && c.s !== "none" ? '<p class="kcol-empty">Arrasta para aqui</p>' : "") +
          add +
        "</div>";
      }).join("") +
      "</div>";

    monthBody.innerHTML = metrics + desafioHTML(d.desafio) + kanban + quadroHTML();
    buildJourney(d.desafio);
    bindMonth();
    ligaTela();
    pintaTela();
  }

  function bindMonth() {
    monthBody.querySelectorAll("[data-toggle]").forEach(function (b) {
      b.addEventListener("click", function () {
        var o = D[pk(py, pm)].obj[+b.getAttribute("data-toggle")];
        o.s = o.s === "done" ? "todo" : "done";
        render();
      });
    });
    monthBody.querySelectorAll("[data-del]").forEach(function (b) {
      b.addEventListener("click", function () {
        D[pk(py, pm)].obj.splice(+b.getAttribute("data-del"), 1);
        render();
      });
    });
    monthBody.querySelectorAll("[data-link]").forEach(function (b) {
      b.addEventListener("click", function () {
        ligarEm = +b.getAttribute("data-link");
        render();
      });
    });
    monthBody.querySelectorAll(".selAula").forEach(function (sel) {
      sel.focus();
      sel.onchange = function () {
        D[pk(py, pm)].obj[+sel.getAttribute("data-i")].a = sel.value || null;
        ligarEm = null;
        render();
      };
      sel.onblur = function () { ligarEm = null; render(); };
    });
    monthBody.querySelectorAll("[data-lesson]").forEach(function (b) {
      b.addEventListener("click", function () {
        window.location.href = "content.html";
      });
    });

    var openAdd = document.getElementById("openAdd");
    if (openAdd) openAdd.onclick = function () { aberto = true; erro = ""; render(); };
    var cancel = document.getElementById("cancelObj");
    if (cancel) cancel.onclick = function () { aberto = false; erro = ""; novaAula = ""; render(); };
    var save = document.getElementById("saveObj");
    var inp = document.getElementById("newObj");
    var selA = document.getElementById("newAula");
    if (selA) selA.onchange = function () { novaAula = this.value; };
    function saveObj() {
      var t = (inp.value || "").trim();
      if (!t) { erro = "Escreve o objetivo primeiro."; render(); return; }
      D[pk(py, pm)].obj.push({ t: t, s: "none", a: novaAula || null });
      aberto = false; erro = ""; novaAula = "";
      render();
    }
    if (save) save.onclick = saveObj;
    if (inp) {
      inp.focus();
      inp.onkeydown = function (e) { if (e.key === "Enter") saveObj(); };
    }

    monthBody.querySelectorAll(".kcard").forEach(function (card) {
      card.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", card.getAttribute("data-i"));
        e.dataTransfer.effectAllowed = "move";
        setTimeout(function () { card.classList.add("drag"); }, 0);
      });
      card.addEventListener("dragend", function () { card.classList.remove("drag"); });
    });
    monthBody.querySelectorAll(".kcol").forEach(function (col) {
      col.addEventListener("dragover", function (e) { e.preventDefault(); col.classList.add("over"); });
      col.addEventListener("dragleave", function () { col.classList.remove("over"); });
      col.addEventListener("drop", function (e) {
        e.preventDefault();
        col.classList.remove("over");
        var i = parseInt(e.dataTransfer.getData("text/plain"), 10);
        var d = D[pk(py, pm)];
        if (isNaN(i) || !d.obj[i]) return;
        d.obj[i].s = col.getAttribute("data-s");
        render();
      });
    });
  }

  render();
})();
</script>
