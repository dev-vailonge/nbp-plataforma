<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<title>NBP · Calendário (V2)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
/* ═══════════════════════════════════
   BASE
   ═══════════════════════════════════ */
:root {
  --bg: #151515;
  --bg-surface: #1C1C1C;
  --bg-elev: #222222;
  --border: #C6C8BA1F;
  --border-strong: #C6C8BA33;
  --text: #FDFFEF;
  --text-muted: #94968D;
  --text-subtle: #6B6C63;
  --accent: #FDFFEF;
  --sidebar-w: 244px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "TT Norms Pro", -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; }

.app { display: flex; min-height: 100vh; }

/* ═══════════════════════════════════
   SIDEBAR
   ═══════════════════════════════════ */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 22px 14px 18px;
  z-index: 10;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 18px;
  margin-bottom: 6px;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: #2A2926;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-name {
  font-size: 1rem; font-weight: 500;
  letter-spacing: 0.07em;
  color: var(--text);
}
.sidebar-profile {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  border: 1px solid var(--border);
  background: rgba(253, 255, 239, 0.015);
  border-radius: 12px;
  margin-bottom: 22px;
  transition: border-color 0.25s ease, background 0.25s ease;
  cursor: pointer;
}
.sidebar-profile:hover {
  border-color: var(--border-strong);
  background: rgba(253, 255, 239, 0.04);
}
.profile-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #C6C8BA 0%, #4B4C47 100%);
  color: #181818;
  font-weight: 700; font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(253, 255, 239, 0.15);
}
.profile-info { min-width: 0; flex: 1; }
.profile-name {
  font-size: 0.88rem; font-weight: 600;
  color: var(--text);
  line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.profile-plan {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.66rem; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 3px;
}
.profile-plan::before {
  content: ""; width: 5px; height: 5px;
  border-radius: 50%;
  background: #C6C8BA;
  box-shadow: 0 0 6px rgba(198, 200, 186, 0.7);
}
.sidebar-label {
  font-size: 0.64rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-subtle);
  padding: 0 12px;
  margin: 4px 0 10px;
}
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  color: var(--text-muted);
  font-size: 0.92rem; font-weight: 500;
  cursor: pointer;
  position: relative;
  transition: color 0.2s ease, background 0.2s ease;
}
.nav-item i { width: 18px; font-size: 16px; text-align: center; color: inherit; opacity: 0.85; }
.nav-item:hover { color: var(--text); background: rgba(253, 255, 239, 0.04); }
.nav-item.active { color: var(--text); background: rgba(253, 255, 239, 0.06); }
.nav-item.active::before {
  content: "";
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 18px;
  border-radius: 2px;
  background: var(--text);
  box-shadow: 0 0 10px rgba(253, 255, 239, 0.6);
}
.sidebar-footer {
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}

/* ═══════════════════════════════════
   MAIN
   ═══════════════════════════════════ */
.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  padding: 28px 40px 80px;
  min-height: 100vh;
  max-width: 1180px;
}

.page-title {
  font-size: clamp(1.9rem, 3.2vw, 2.3rem);
  font-weight: 600;
  line-height: 1.2;
  margin: 0 0 20px;
  color: var(--text);
  letter-spacing: -0.01em;
}

.cal-tabs {
  display: flex;
  align-items: center;
  gap: 20px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.cal-tab {
  border: none;
  background: none;
  padding: 0 0 12px;
  font-size: 0.98rem;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  cursor: pointer;
  box-shadow: none;
}
.cal-tab i { font-size: 15px; opacity: 0.85; }
.cal-tab:hover { color: var(--text); }
.cal-tab.active {
  color: var(--text);
  box-shadow: inset 0 -2px 0 0 #C6C8BA;
}
.cal-nav {
  margin-left: auto;
  display: flex;
  gap: 2px;
  padding-bottom: 10px;
  align-items: center;
}
.cal-nav button {
  border: none;
  background: none;
  padding: 5px 10px;
  font-size: 0.95rem;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 6px;
}
.cal-nav button:hover {
  color: var(--text);
  background: rgba(253, 255, 239, 0.04);
}

.cal-month {
  margin: 0 0 16px;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text);
}

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
}
.cal-weekdays span {
  font-size: 0.84rem;
  color: var(--text-subtle);
  padding: 0 0 10px 8px;
  text-transform: lowercase;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border-left: 1px solid var(--border);
  border-top: 1px solid var(--border);
}
.cal-cell {
  min-height: 96px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 7px 8px;
  background: transparent;
}
.cal-cell.out {
  background: #181816;
}
.cal-daynum {
  margin: 0 0 6px;
  text-align: right;
  font-size: 0.88rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}
.cal-cell.out .cal-daynum { color: #5C5B55; }
.cal-daynum .today {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px; height: 24px;
  border-radius: 50%;
  background: #C6C8BA;
  color: #1A1A18;
  font-weight: 600;
}

.cal-pill {
  display: block;
  border-radius: 5px;
  padding: 3px 7px;
  font-size: 0.8rem;
  line-height: 1.35;
  margin-bottom: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cal-pill.tutoria { background: #16293D; color: #8FBEEA; }
.cal-pill.growth { background: #123028; color: #5FC7A4; }
.cal-pill.scale { background: #33260F; color: #E0AC5E; }

.cal-legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 16px;
  font-size: 0.86rem;
  color: var(--text-muted);
}
.cal-legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.cal-legend i {
  width: 10px; height: 10px;
  border-radius: 2px;
  display: inline-block;
}
.cal-legend .dot-t { background: #5DA9F0; }
.cal-legend .dot-g { background: #3FBE93; }
.cal-legend .dot-s { background: #D19A4E; }

/* List view */
.cal-list { display: flex; flex-direction: column; }
.cal-list-row {
  display: flex;
  gap: 14px;
  align-items: center;
  padding: 14px 2px;
  border-bottom: 1px solid var(--border);
}
.cal-list-date {
  flex: 0 0 78px;
  font-size: 0.92rem;
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
}
.cal-list-bar {
  width: 3px; flex: 0 0 3px; height: 34px;
  border-radius: 2px;
}
.cal-list-bar.tutoria { background: #5DA9F0; }
.cal-list-bar.growth { background: #3FBE93; }
.cal-list-bar.scale { background: #D19A4E; }
.cal-list-title {
  display: block;
  font-size: 1.02rem;
  font-weight: 500;
  color: var(--text);
}
.cal-list-sub {
  display: block;
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Gallery view */
.cal-gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
}
.cal-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg-surface);
  transition: border-color 0.2s ease;
}
.cal-card:hover { border-color: var(--border-strong); }
.cal-card-thumb {
  aspect-ratio: 16 / 9;
  display: flex;
  align-items: flex-end;
  padding: 10px;
}
.cal-card-thumb.tutoria { background: #16293D; }
.cal-card-thumb.growth { background: #123028; }
.cal-card-thumb.scale { background: #33260F; }
.cal-card-date {
  font-size: 0.8rem;
  font-variant-numeric: tabular-nums;
}
.cal-card-thumb.tutoria .cal-card-date { color: #8FBEEA; }
.cal-card-thumb.growth .cal-card-date { color: #5FC7A4; }
.cal-card-thumb.scale .cal-card-date { color: #E0AC5E; }
.cal-card-body { padding: 12px 14px; }
.cal-card-body p {
  margin: 0;
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
}
.cal-card-body span {
  display: block;
  margin-top: 4px;
  font-size: 0.84rem;
  color: var(--text-muted);
}

.cal-empty {
  padding: 28px 16px;
  text-align: center;
  color: var(--text-muted);
  font-size: 1rem;
  border: 1px dashed var(--border);
  border-radius: 12px;
}

.mobile-toggle { display: none; }
.mobile-toggle-wrap {
  display: none;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.mobile-toggle-wrap button {
  width: 38px; height: 38px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--text-muted);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
}

@media (max-width: 860px) {
  .sidebar { transform: translateX(-100%); transition: transform 0.3s ease; }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 28px 20px 70px; }
  .mobile-toggle-wrap { display: flex; }
  .mobile-toggle { display: inline-flex !important; }
  .cal-cell { min-height: 72px; padding: 5px; }
  .cal-pill { font-size: 0.72rem; padding: 2px 5px; }
  .cal-weekdays span { padding-left: 4px; font-size: 0.76rem; }
}

/* ═══════════════════════════════════
   V2 PORTAL SHELL — nbp-portal.html

:root {

}
.sidebar {

  background: #161615 !important;
  border-right: 0.5px solid var(--bd) !important;
  padding: 16px 10px !important;
  z-index: 10 !important;
  transform: none !important;
}
.sidebar-brand {
  padding: 4px 8px 18px !important;
  margin-bottom: 4px !important;
}
.brand-name {
  font-size: 16px !important;
  font-weight: 500 !important;
  color: var(--tx) !important;
}
.sidebar-profile {
  gap: 10px !important;
  padding: 9px 8px !important;
  border: 0.5px solid var(--bd) !important;
  background: var(--sup2) !important;
  border-radius: 9px !important;
  margin-bottom: 14px !important;
}
.sidebar-profile:hover {
  border-color: var(--bd2) !important;
  background: #24231F !important;
}
.sidebar-profile .fa-chevron-right { display: none !important; }
.profile-avatar {
  width: 30px !important;
  height: 30px !important;
  background: var(--fill) !important;
  color: var(--salvia) !important;
  font-weight: 600 !important;
  font-size: 0.72rem !important;
  box-shadow: none !important;
}
.profile-name {
  font-size: 0.82rem !important;
  font-weight: 500 !important;
  color: var(--tx) !important;
}
.profile-plan {
  font-size: 0.64rem !important;
  color: var(--tx3) !important;
}
.profile-plan::before {
  background: var(--salvia) !important;
  box-shadow: none !important;
}
.sidebar-label {
  font-size: 0.62rem !important;
  letter-spacing: 0.14em !important;
  color: var(--tx3) !important;
  padding: 4px 8px 8px !important;
  margin: 0 !important;
}
.nav-item {
  gap: 10px !important;
  padding: 9px !important;
  border-radius: 7px !important;
  color: var(--tx2) !important;
  font-size: 13.5px !important;
  font-weight: 400 !important;
}
.nav-item i { font-size: 15px !important; opacity: 0.9 !important; }
.nav-item:hover { color: var(--tx) !important; background: var(--sup2) !important; }
.nav-item.active {
  color: var(--tx) !important;
  background: var(--fill) !important;
}
.nav-item.active::before { display: none !important; }
.sidebar-footer {
  padding-top: 12px !important;
  border-top: 0.5px solid var(--bd) !important;
}
.main {
  flex: 1 !important;
  min-width: 0 !important;
  margin-left: 0 !important;
  padding: 24px !important;
  min-height: 0 !important;
  max-width: none !important;
  background: var(--sup) !important;
}
@media (max-width: 860px) {
  .app-wrap { padding: 0 !important; }
  .app {
    border-radius: 0 !important;

    min-height: 100vh !important;
    flex-direction: column !important;
  }
  .sidebar {
    position: fixed !important;
    inset: 0 auto 0 0 !important;

  }

}
</style>
</head>

<script>
(function () {
  var MES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var DIAS = ["seg","ter","qua","qui","sex","sáb","dom"];
  var HOJE = new Date(2026, 7, 21);
  var ROT = ["Desenv. pessoal", "Financeira", "Conteúdo", "IA"];
  var ACC = [
    { lb: "GROWTH", kind: "growth", sub: "Accountability" },
    { lb: "SCALE", kind: "scale", sub: "Accountability" }
  ];

  var cy = 2026, cmo = 7, view = "cal";
  var root = document.getElementById("calRoot");
  var monthLabel = document.getElementById("calMonthLabel");

  function ky(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function evd(d) {
    var o = [], w = d.getDay(), n = Math.floor((d.getDate() - 1) / 7);
    if (w === 2) o.push({ lb: ROT[n % 4], kind: "tutoria", sub: "Tutoria" });
    if (w === 4) {
      var a = ACC[n % 2];
      o.push({ lb: a.lb, kind: a.kind, sub: a.sub });
    }
    return o;
  }

  function render() {
    monthLabel.textContent = MES[cmo] + " de " + cy;
    var h = "";

    if (view === "cal") {
      h += '<div class="cal-weekdays">' + DIAS.map(function (x) {
        return "<span>" + x + "</span>";
      }).join("") + "</div>";
      h += '<div class="cal-grid">';
      var off = (new Date(cy, cmo, 1).getDay() + 6) % 7;
      var st = new Date(cy, cmo, 1 - off);
      for (var i = 0; i < 42; i++) {
        var dd = new Date(st);
        dd.setDate(st.getDate() + i);
        var out = dd.getMonth() !== cmo;
        var hj = ky(dd) === ky(HOJE);
        var es = out ? [] : evd(dd);
        h += '<div class="cal-cell' + (out ? " out" : "") + '">' +
          '<p class="cal-daynum">' +
            (hj ? '<span class="today">' + dd.getDate() + "</span>" : dd.getDate()) +
          "</p>" +
          es.map(function (e) {
            return '<span class="cal-pill ' + e.kind + '">' + e.lb + "</span>";
          }).join("") +
        "</div>";
      }
      h += "</div>";
      h += '<div class="cal-legend">' +
        '<span><i class="dot-t" aria-hidden="true"></i>tutoria · terças</span>' +
        '<span><i class="dot-g" aria-hidden="true"></i>growth · quintas</span>' +
        '<span><i class="dot-s" aria-hidden="true"></i>scale · quintas</span>' +
      "</div>";
    } else if (view === "lst") {
      var dim = new Date(cy, cmo + 1, 0).getDate();
      var rows = "";
      for (var j = 1; j <= dim; j++) {
        var dt = new Date(cy, cmo, j);
        rows += evd(dt).map(function (e) {
          return '<div class="cal-list-row">' +
            '<span class="cal-list-date">' + DIAS[(dt.getDay() + 6) % 7] + " " + j + "</span>" +
            '<span class="cal-list-bar ' + e.kind + '" aria-hidden="true"></span>' +
            "<span>" +
              '<span class="cal-list-title">' + e.lb + "</span>" +
              '<span class="cal-list-sub">18h00 · ' + e.sub + "</span>" +
            "</span>" +
          "</div>";
        }).join("");
      }
      h += rows || '<div class="cal-empty">Sem eventos neste mês.</div>';
    } else {
      var dm = new Date(cy, cmo + 1, 0).getDate();
      var cards = "";
      for (var q = 1; q <= dm; q++) {
        var t2 = new Date(cy, cmo, q);
        cards += evd(t2).map(function (e) {
          return '<article class="cal-card">' +
            '<div class="cal-card-thumb ' + e.kind + '">' +
              '<span class="cal-card-date">' + q + " " + MES[cmo].slice(0, 3) + "</span>" +
            "</div>" +
            '<div class="cal-card-body">' +
              "<p>" + e.lb + "</p>" +
              "<span>" + e.sub + "</span>" +
            "</div>" +
          "</article>";
        }).join("");
      }
      h += cards
        ? '<div class="cal-gallery">' + cards + "</div>"
        : '<div class="cal-empty">Sem eventos neste mês.</div>';
    }

    root.innerHTML = h;
  }

  document.querySelectorAll(".cal-tab").forEach(function (b) {
    b.addEventListener("click", function () {
      view = b.getAttribute("data-v");
      document.querySelectorAll(".cal-tab").forEach(function (x) {
        var on = x === b;
        x.classList.toggle("active", on);
        x.setAttribute("aria-selected", on ? "true" : "false");
      });
      render();
    });
  });

  document.getElementById("calPrev").addEventListener("click", function () {
    cmo--;
    if (cmo < 0) { cmo = 11; cy--; }
    render();
  });
  document.getElementById("calNext").addEventListener("click", function () {
    cmo++;
    if (cmo > 11) { cmo = 0; cy++; }
    render();
  });
  document.getElementById("calToday").addEventListener("click", function () {
    cy = 2026; cmo = 7;
    render();
  });

  render();

  var toggle = document.getElementById("mobileToggle");
  var sidebar = document.getElementById("sidebar");
  if (toggle && sidebar) {
    toggle.addEventListener("click", function (e) {
      e.stopPropagation();
      sidebar.classList.toggle("open");
    });
    document.addEventListener("click", function (e) {
      if (window.innerWidth > 860) return;
      if (!sidebar.contains(e.target) && e.target !== toggle) {
        sidebar.classList.remove("open");
      }
    });
  }
})();
</script>
</body>
</html>
