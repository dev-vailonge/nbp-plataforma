<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>NBP · Backoffice — Membros</title>
<meta name="color-scheme" content="dark"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../assets/nbp-admin.css"/>
<script src="../assets/nbp-admin.js"></script>
</head>
<body>
<script>NBPAdmin.requireAuth();</script>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
<div class="app-wrap">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div class="page-head">
      <div>
        <h1 class="page-title">Membros</h1>
        <p class="page-sub">Quem entra no portal. Desativar em vez de apagar.</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-primary" href="member.html?new=1"><i class="fa-solid fa-plus" aria-hidden="true"></i> Novo membro</a>
      </div>
    </div>
    <div class="toolbar">
      <div class="search">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
        <input id="q" type="search" placeholder="Nome, email, cidade…" aria-label="Pesquisar membros"/>
      </div>
      <select id="setor" aria-label="Filtrar setor">
        <option value="">Todos os setores</option>
      </select>
      <select id="plan" aria-label="Filtrar plano">
        <option value="">Todos os planos</option>
        <option value="ativo">Membro ativo</option>
        <option value="inativo">Inativo</option>
      </select>
    </div>
    <div id="tableRoot"></div>
  </main>
</div>
</div>
<script>
(function () {
  var A = NBPAdmin;
  A.mountShell("members");
  var setorSel = document.getElementById("setor");
  Object.keys(A.SETORES).forEach(function (k) {
    setorSel.innerHTML += '<option value="' + k + '">' + A.esc(A.SETORES[k]) + "</option>";
  });

  function render() {
    var data = A.load();
    var q = (document.getElementById("q").value || "").toLowerCase().trim();
    var setor = setorSel.value;
    var plan = document.getElementById("plan").value;
    var rows = data.members.filter(function (m) {
      if (setor && m.s !== setor) return false;
      if (plan && m.plan !== plan) return false;
      if (!q) return true;
      var blob = [m.n, m.e, m.c, m.empresa, A.SETORES[m.s] || ""].join(" ").toLowerCase();
      return blob.indexOf(q) !== -1;
    });

    if (!rows.length) {
      document.getElementById("tableRoot").innerHTML = '<div class="empty">Nenhum membro com estes filtros.</div>';
      return;
    }

    var html = '<div class="table-wrap"><table class="data"><thead><tr>' +
      "<th>Nome</th><th>Cidade</th><th>Setor</th><th>Plano</th><th>Papel</th><th></th>" +
      "</tr></thead><tbody>";
    rows.forEach(function (m) {
      html += '<tr data-id="' + A.esc(m.id) + '">' +
        "<td><a href=\"member.html?id=" + encodeURIComponent(m.id) + "\">" + A.esc(m.n) + "</a><div class=\"muted\">" + A.esc(m.e) + "</div></td>" +
        "<td>" + A.esc(m.c || "—") + "</td>" +
        "<td>" + A.esc(A.SETORES[m.s] || m.s || "—") + "</td>" +
        '<td><span class="pill ' + (m.plan === "ativo" ? "pill-ok" : "pill-off") + '">' + (m.plan === "ativo" ? "Ativo" : "Inativo") + "</span></td>" +
        "<td>" + A.esc(m.papel || "cliente") + "</td>" +
        '<td><a class="btn btn-sm" href="member-plan.html?id=' + encodeURIComponent(m.id) + '">Plano</a></td>' +
        "</tr>";
    });
    html += "</tbody></table></div>";
    document.getElementById("tableRoot").innerHTML = html;
    document.querySelectorAll("table.data tbody tr").forEach(function (tr) {
      tr.addEventListener("click", function (e) {
        if (e.target.closest("a")) return;
        window.location.href = "member.html?id=" + encodeURIComponent(tr.getAttribute("data-id"));
      });
    });
  }

  document.getElementById("q").addEventListener("input", render);
  setorSel.addEventListener("change", render);
  document.getElementById("plan").addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
