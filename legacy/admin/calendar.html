<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>NBP · Backoffice — Calendário</title>
<meta name="color-scheme" content="dark"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../assets/nbp-admin.css"/>
<script src="../assets/nbp-admin.js"></script>
</head>
<body>
<script>NBPAdmin.requireAuth();</script>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
<div class="app-wrap">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div class="page-head">
      <div>
        <h1 class="page-title">Calendário</h1>
        <p class="page-sub">Regras recorrentes (terças / quintas) e eventos pontuais.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-primary" id="newEvent">Novo evento</button>
      </div>
    </div>
    <div class="cal-toolbar">
      <div class="page-actions">
        <button type="button" class="btn btn-sm" id="prev">‹</button>
        <button type="button" class="btn btn-sm" id="today">Hoje</button>
        <button type="button" class="btn btn-sm" id="next">›</button>
      </div>
      <p class="cal-month" id="monthLabel"></p>
    </div>
    <div id="calRoot"></div>
    <div class="panel" style="margin-top:18px" id="rulesPanel"></div>
  </main>
</div>
</div>
<script>
(function () {
  var A = NBPAdmin;
  A.mountShell("calendar");
  var now = new Date();
  var cy = now.getFullYear();
  var cmo = now.getMonth();

  function eventForm(ev, dateStr) {
    ev = ev || { title: "", kind: "presencial", hour: "18h00", date: dateStr || A.ky(new Date()), type: "oneoff" };
    return '<div class="field"><label for="ed">Data</label><input id="ed" type="date" value="' + A.esc(ev.date) + '"/></div>' +
      '<div class="field" style="margin-top:10px"><label for="et">Título</label><input id="et" value="' + A.esc(ev.title) + '"/></div>' +
      '<div class="field" style="margin-top:10px"><label for="eh">Hora</label><input id="eh" value="' + A.esc(ev.hour || "18h00") + '"/></div>' +
      '<div class="field" style="margin-top:10px"><label for="ek">Tipo</label><select id="ek">' +
        ["tutoria", "growth", "scale", "presencial"].map(function (k) {
          return '<option value="' + k + '"' + (ev.kind === k ? " selected" : "") + ">" + k + "</option>";
        }).join("") +
      "</select></div>";
  }

  function openEvent(ev) {
    var isGen = ev && ev.type === "generated";
    var isPersisted = ev && (ev.type === "oneoff" || ev.type === "override");
    A.showModal({
      title: ev ? ev.title : "Novo evento",
      bodyHtml: eventForm(ev, ev && ev.date),
      okLabel: "Guardar",
      onOk: function (box) {
        var data = A.load();
        var payload = {
          date: box.querySelector("#ed").value,
          title: (box.querySelector("#et").value || "").trim(),
          hour: box.querySelector("#eh").value.trim() || "18h00",
          kind: box.querySelector("#ek").value
        };
        if (!payload.title || !payload.date) { A.toast("Preenche título e data."); return; }
        if (isGen) {
          payload.id = A.uid("ev");
          payload.type = "override";
          payload.ruleId = ev.ruleId;
          data.events.push(payload);
        } else if (isPersisted) {
          var cur = A.findById(data.events, ev.id);
          if (cur) {
            cur.date = payload.date;
            cur.title = payload.title;
            cur.hour = payload.hour;
            cur.kind = payload.kind;
          }
        } else {
          payload.id = A.uid("ev");
          payload.type = "oneoff";
          data.events.push(payload);
        }
        A.save(data);
        A.closeModal();
        A.toast("Evento guardado.");
        render();
      }
    });
    if (ev && (isGen || isPersisted)) {
      var box = document.querySelector("#nbpModal .modal .form-actions");
      var extra = document.createElement("button");
      extra.type = "button";
      extra.className = "btn btn-danger";
      extra.textContent = "Cancelar slot";
      extra.onclick = function () {
        var data = A.load();
        if (isGen) {
          data.events.push({ id: A.uid("ev"), type: "cancel", date: ev.date, ruleId: ev.ruleId });
        } else {
          data.events = data.events.filter(function (e) { return e.id !== ev.id; });
        }
        A.save(data);
        A.closeModal();
        A.toast("Slot cancelado.");
        render();
      };
      box.insertBefore(extra, box.firstChild);
    }
  }

  function render() {
    var data = A.load();
    document.getElementById("monthLabel").textContent = A.MES[cmo] + " de " + cy;
    var h = '<div class="cal-weekdays">' + A.DIAS.map(function (x) { return "<span>" + x + "</span>"; }).join("") + "</div>";
    h += '<div class="cal-grid">';
    var off = (new Date(cy, cmo, 1).getDay() + 6) % 7;
    var st = new Date(cy, cmo, 1 - off);
    var hoje = A.ky(new Date());
    for (var i = 0; i < 42; i++) {
      var dd = new Date(st);
      dd.setDate(st.getDate() + i);
      var out = dd.getMonth() !== cmo;
      var key = A.ky(dd);
      var es = out ? [] : A.eventsForDate(dd, data);
      h += '<div class="cal-cell' + (out ? " out" : "") + '" data-day="' + key + '">' +
        '<p class="cal-daynum">' + (key === hoje ? '<span class="today">' + dd.getDate() + "</span>" : dd.getDate()) + "</p>" +
        es.map(function (e) {
          return '<button type="button" class="cal-pill ' + e.kind + '" data-eid="' + A.esc(e.id) + '" data-date="' + key + '">' + A.esc(e.title) + "</button>";
        }).join("") +
      "</div>";
    }
    h += "</div>";
    h += '<div class="cal-legend">' +
      '<span><i class="dot-t" aria-hidden="true"></i>tutoria</span>' +
      '<span><i class="dot-g" aria-hidden="true"></i>growth</span>' +
      '<span><i class="dot-s" aria-hidden="true"></i>scale</span>' +
      '<span><i class="dot-p" aria-hidden="true"></i>presencial</span>' +
    "</div>";
    document.getElementById("calRoot").innerHTML = h;

    document.querySelectorAll(".cal-pill").forEach(function (b) {
      b.onclick = function () {
        var date = b.getAttribute("data-date");
        var id = b.getAttribute("data-eid");
        var evs = A.eventsForDate(new Date(date + "T12:00:00"), A.load());
        var ev = null;
        evs.forEach(function (e) { if (e.id === id) ev = e; });
        if (ev) openEvent(ev);
      };
    });

    var rulesHtml = '<h2 class="panel-title">Regras recorrentes</h2>';
    data.rules.forEach(function (r) {
      rulesHtml += '<div class="list-row">' +
        '<div class="grow"><strong>' + (r.kind === "tutoria" ? "Tutoria" : "Accountability") + "</strong>" +
        '<div class="muted">' + A.weekdayLabel(r.weekday) + "s · " + A.esc(r.hour) + " · " + A.esc((r.rotation || []).join(" → ")) + "</div></div>" +
        '<button type="button" class="btn btn-sm" data-rule="' + A.esc(r.id) + '">Editar</button>' +
      "</div>";
    });
    document.getElementById("rulesPanel").innerHTML = rulesHtml;
    document.querySelectorAll("[data-rule]").forEach(function (b) {
      b.onclick = function () {
        var r = A.findById(A.load().rules, b.getAttribute("data-rule"));
        A.showModal({
          title: "Editar regra",
          bodyHtml:
            '<div class="field"><label for="rw">Dia da semana</label><select id="rw">' +
              [0,1,2,3,4,5,6].map(function (d) {
                return '<option value="' + d + '"' + (r.weekday === d ? " selected" : "") + ">" + A.weekdayLabel(d) + "</option>";
              }).join("") +
            "</select></div>" +
            '<div class="field" style="margin-top:10px"><label for="rh">Hora</label><input id="rh" value="' + A.esc(r.hour) + '"/></div>' +
            '<div class="field" style="margin-top:10px"><label for="rr">Rotação (separada por vírgulas)</label><input id="rr" value="' + A.esc((r.rotation || []).join(", ")) + '"/></div>',
          okLabel: "Guardar",
          onOk: function (box) {
            var d = A.load();
            var cur = A.findById(d.rules, r.id);
            cur.weekday = parseInt(box.querySelector("#rw").value, 10);
            cur.hour = box.querySelector("#rh").value.trim() || "18h00";
            cur.rotation = box.querySelector("#rr").value.split(",").map(function (x) { return x.trim(); }).filter(Boolean);
            A.save(d);
            A.closeModal();
            A.toast("Regra atualizada.");
            render();
          }
        });
      };
    });
  }

  document.getElementById("prev").onclick = function () {
    cmo -= 1;
    if (cmo < 0) { cmo = 11; cy -= 1; }
    render();
  };
  document.getElementById("next").onclick = function () {
    cmo += 1;
    if (cmo > 11) { cmo = 0; cy += 1; }
    render();
  };
  document.getElementById("today").onclick = function () {
    var t = new Date();
    cy = t.getFullYear();
    cmo = t.getMonth();
    render();
  };
  document.getElementById("newEvent").onclick = function () { openEvent(null); };

  render();
})();
</script>
</body>
</html>
