<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>NBP · Backoffice — Aula</title>
<meta name="color-scheme" content="dark"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../assets/nbp-admin.css"/>
<script src="../assets/nbp-admin.js"></script>
</head>
<body>
<script>NBPAdmin.requireAuth();</script>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
<div class="app-wrap">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div class="page-head">
      <div>
        <h1 class="page-title" id="pageTitle">Nova aula</h1>
        <p class="page-sub" id="backLink"></p>
      </div>
    </div>
    <form class="panel" id="form">
      <div class="form-grid">
        <div class="field span-2"><label for="t">Título</label><input id="t" required/></div>
        <div class="field">
          <label for="moduleId">Módulo</label>
          <select id="moduleId"></select>
        </div>
        <div class="field"><label for="d">Duração</label><input id="d" placeholder="12 min"/></div>
        <div class="field"><label for="dt">Data (lives)</label><input id="dt" placeholder="18 ago"/></div>
        <div class="field">
          <label for="status">Estado</label>
          <select id="status">
            <option value="rascunho">Rascunho</option>
            <option value="publicado">Publicado</option>
          </select>
        </div>
        <div class="field span-2"><label for="video">URL de vídeo (mock)</label><input id="video" placeholder="https://…"/></div>
        <div class="field">
          <label for="color">Cor do card</label>
          <input id="color" type="text" placeholder="#125A47"/>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-ghost" id="cancelLink" href="content.html">Cancelar</a>
      </div>
    </form>
  </main>
</div>
</div>
<script>
(function () {
  var A = NBPAdmin;
  A.mountShell("content");
  var data = A.load();
  var isNew = A.param("new") === "1";
  var id = A.param("id");
  var moduleParam = A.param("module");
  var lesson = id ? A.findById(data.lessons, id) : null;
  var moduleSel = document.getElementById("moduleId");

  data.modules.forEach(function (m) {
    moduleSel.innerHTML += '<option value="' + A.esc(m.id) + '">' + A.esc(m.t) + "</option>";
  });

  var backMod = (lesson && lesson.moduleId) || moduleParam || "";
  document.getElementById("backLink").innerHTML = '<a href="content.html' + (backMod ? "?module=" + encodeURIComponent(backMod) : "") + '">← Conteúdos</a>';
  document.getElementById("cancelLink").href = "content.html" + (backMod ? "?module=" + encodeURIComponent(backMod) : "");

  if (!isNew && !lesson) {
    document.getElementById("pageTitle").textContent = "Aula não encontrada";
    document.getElementById("form").innerHTML = '<p>Esta aula já não existe. <a href="content.html">Voltar</a>.</p>';
    return;
  }

  if (lesson) {
    document.getElementById("pageTitle").textContent = lesson.t;
    document.getElementById("t").value = lesson.t || "";
    document.getElementById("moduleId").value = lesson.moduleId;
    document.getElementById("d").value = lesson.d || "";
    document.getElementById("dt").value = lesson.dt || "";
    document.getElementById("status").value = lesson.status || "rascunho";
    document.getElementById("video").value = lesson.video || "";
    var mod = A.findById(data.modules, lesson.moduleId);
    document.getElementById("color").value = (mod && mod.c) || "";
  } else if (moduleParam) {
    moduleSel.value = moduleParam;
    var m0 = A.findById(data.modules, moduleParam);
    if (m0) document.getElementById("color").value = m0.c || "";
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    data = A.load();
    var payload = {
      t: document.getElementById("t").value.trim(),
      moduleId: document.getElementById("moduleId").value,
      d: document.getElementById("d").value.trim(),
      dt: document.getElementById("dt").value.trim(),
      status: document.getElementById("status").value,
      video: document.getElementById("video").value.trim()
    };
    var color = document.getElementById("color").value.trim();
    if (color) {
      var mod = A.findById(data.modules, payload.moduleId);
      if (mod) mod.c = color;
    }
    if (isNew || !lesson) {
      payload.id = A.uid("ls");
      data.lessons.push(payload);
    } else {
      payload.id = lesson.id;
      for (var i = 0; i < data.lessons.length; i++) {
        if (data.lessons[i].id === lesson.id) { data.lessons[i] = payload; break; }
      }
    }
    A.save(data);
    A.toast("Aula guardada.");
    window.location.href = "content.html?module=" + encodeURIComponent(payload.moduleId);
  });
})();
</script>
</body>
</html>
