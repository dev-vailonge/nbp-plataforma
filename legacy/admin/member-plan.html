<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>NBP · Backoffice — Plano de ação</title>
<meta name="color-scheme" content="dark"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../assets/nbp-admin.css"/>
<script src="../assets/nbp-admin.js"></script>
</head>
<body>
<script>NBPAdmin.requireAuth();</script>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
<div class="app-wrap">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div class="page-head">
      <div>
        <h1 class="page-title" id="pageTitle">Plano de ação</h1>
        <p class="page-sub" id="pageSub"></p>
      </div>
      <div class="page-actions" id="headActions"></div>
    </div>
    <div id="root"></div>
  </main>
</div>
</div>
<script>
(function () {
  var A = NBPAdmin;
  A.mountShell("members");
  var id = A.param("id");
  var data = A.load();
  var member = id ? A.findById(data.members, id) : null;
  var py = 2026, pm = 7;

  if (!member) {
    document.getElementById("pageTitle").textContent = "Membro não encontrado";
    document.getElementById("pageSub").innerHTML = '<a href="members.html">← Membros</a>';
    document.getElementById("root").innerHTML = "<p>Não há plano sem um membro. <a href=\"members.html\">Voltar à lista</a>.</p>";
    return;
  }

  document.getElementById("pageTitle").textContent = "Plano de " + member.n;
  document.getElementById("pageSub").innerHTML =
    '<a href="members.html">← Membros</a> · <a href="member.html?id=' + encodeURIComponent(member.id) + '">Ficha</a>';

  function months() {
    return A.getMemberPlan(A.load(), member.id);
  }

  function month() {
    return months()[A.planKey(py, pm)];
  }

  function persistMonth(d) {
    var store = A.load();
    var map = A.getMemberPlan(store, member.id);
    map[A.planKey(py, pm)] = d;
    A.save(store);
  }

  function lessonOptions(sel) {
    var store = A.load();
    var html = '<option value="">Sem aula associada</option>';
    (store.lessons || []).forEach(function (l) {
      html += '<option value="' + A.esc(l.id) + '"' + (sel === l.id ? " selected" : "") + ">" + A.esc(l.t) + (l.d ? " · " + A.esc(l.d) : "") + "</option>";
    });
    return html;
  }

  function statusOptions(list, val) {
    return list.map(function (c) {
      return '<option value="' + c.s + '"' + (val === c.s ? " selected" : "") + ">" + A.esc(c.lb) + "</option>";
    }).join("");
  }

  function momHint(f, d) {
    var prev = months()[A.prevPlanKey(py, pm)];
    if (!prev || !prev.met) return "";
    var v = d.met[f.k], pa = prev.met[f.k];
    if (v === "" || pa == null || pa === "" || Number(pa) === 0) return "";
    var dl = ((Number(v) - Number(pa)) / Number(pa)) * 100;
    var bom = f.up ? dl > 0 : dl < 0;
    var cls = Math.abs(dl) < 0.5 ? "" : (bom ? " good" : " bad");
    var st = Math.abs(dl) < 0.5 ? "—" : (dl > 0 ? "↑" : "↓");
    return '<div class="metric-hint' + cls + '">' + st + " " + Math.abs(dl).toFixed(1) + "% vs " + A.MES[(pm + 11) % 12] + "</div>";
  }

  function ensureObjIds(d) {
    (d.obj || []).forEach(function (o) {
      if (!o.id) o.id = A.uid("obj");
    });
  }

  function bind() {
    var d = month();
    if (!d) return;

    document.getElementById("savePlan").onclick = saveFromDom;
    document.getElementById("addStage").onclick = function () {
      saveFromDom(true);
      d = month();
      d.desafio.stages.push({ name: "Nova etapa", status: "locked", sub: "—" });
      persistMonth(d);
      A.toast("Etapa adicionada.");
      render();
    };
    document.getElementById("addObj").onclick = function () {
      saveFromDom(true);
      d = month();
      d.obj.push({ id: A.uid("obj"), t: "", s: "none", a: null });
      persistMonth(d);
      A.toast("Objetivo adicionado.");
      render();
    };

    document.querySelectorAll("[data-stage-up]").forEach(function (b) {
      b.onclick = function () {
        saveFromDom(true);
        d = month();
        var i = +b.getAttribute("data-stage-up");
        if (i <= 0) return;
        var s = d.desafio.stages.splice(i, 1)[0];
        d.desafio.stages.splice(i - 1, 0, s);
        persistMonth(d);
        render();
      };
    });
    document.querySelectorAll("[data-stage-down]").forEach(function (b) {
      b.onclick = function () {
        saveFromDom(true);
        d = month();
        var i = +b.getAttribute("data-stage-down");
        if (i >= d.desafio.stages.length - 1) return;
        var s = d.desafio.stages.splice(i, 1)[0];
        d.desafio.stages.splice(i + 1, 0, s);
        persistMonth(d);
        render();
      };
    });
    document.querySelectorAll("[data-stage-del]").forEach(function (b) {
      b.onclick = function () {
        saveFromDom(true);
        d = month();
        var i = +b.getAttribute("data-stage-del");
        d.desafio.stages.splice(i, 1);
        persistMonth(d);
        A.toast("Etapa removida.");
        render();
      };
    });
    document.querySelectorAll("[data-obj-del]").forEach(function (b) {
      b.onclick = function () {
        saveFromDom(true);
        d = month();
        var oid = b.getAttribute("data-obj-del");
        d.obj = d.obj.filter(function (o) { return o.id !== oid; });
        persistMonth(d);
        A.toast("Objetivo removido.");
        render();
      };
    });
  }

  function saveFromDom(silent) {
    var d = month();
    if (!d) return;
    ensureObjIds(d);
    A.CAMPOS.forEach(function (f) {
      var el = document.getElementById("met-" + f.k);
      if (!el) return;
      var raw = el.value.trim();
      d.met[f.k] = raw === "" ? "" : Number(raw);
    });
    d.desafio.title = document.getElementById("dz-title").value.trim();
    d.desafio.sub = document.getElementById("dz-sub").value.trim();
    d.desafio.flagMain = document.getElementById("dz-flagMain").value.trim();
    d.desafio.flagPrefix = document.getElementById("dz-flagPrefix").value.trim();
    d.desafio.flagTarget = document.getElementById("dz-flagTarget").value.trim();
    d.desafio.fill = document.getElementById("dz-fill").value.trim() || "0%";

    var currentIdx = null;
    d.desafio.stages.forEach(function (st, i) {
      var name = document.getElementById("st-name-" + i);
      var sub = document.getElementById("st-sub-" + i);
      var status = document.getElementById("st-status-" + i);
      if (name) st.name = name.value.trim();
      if (sub) st.sub = sub.value.trim();
      if (status) {
        st.status = status.value;
        if (st.status === "current") currentIdx = i;
      }
    });
    if (currentIdx != null) {
      d.desafio.stages.forEach(function (st, i) {
        if (i !== currentIdx && st.status === "current") st.status = "locked";
      });
    }

    d.obj.forEach(function (o) {
      var t = document.getElementById("ob-t-" + o.id);
      var s = document.getElementById("ob-s-" + o.id);
      var a = document.getElementById("ob-a-" + o.id);
      if (t) o.t = t.value.trim();
      if (s) o.s = s.value;
      if (a) o.a = a.value || null;
    });

    persistMonth(d);
    if (!silent) A.toast("Plano guardado.");
  }

  function render() {
    var map = months();
    var k = A.planKey(py, pm);
    var d = map[k];
    var html = '<div class="month-nav"><div class="year-nav">' +
      '<button type="button" class="btn btn-sm" id="yearPrev" aria-label="Ano anterior"><i class="fa-solid fa-chevron-left"></i></button>' +
      "<strong>" + py + "</strong>" +
      '<button type="button" class="btn btn-sm" id="yearNext" aria-label="Ano seguinte"><i class="fa-solid fa-chevron-right"></i></button>' +
      "</div></div>";
    html += '<div class="month-pills" role="tablist" aria-label="Meses">';
    A.MAB.forEach(function (lb, i) {
      var has = !!map[A.planKey(py, i)];
      html += '<button type="button" class="month-pill' + (i === pm ? " active" : "") + (has ? " has-data" : "") + '" data-m="' + i + '">' + lb + "</button>";
    });
    html += "</div>";

    if (!d) {
      html += '<div class="empty">Ainda não há plano para ' + A.MES[pm] + " de " + py + ".<br/>" +
        '<button type="button" class="btn btn-primary" id="startMonth" style="margin-top:14px">Começar ' + A.MES[pm] + "</button></div>";
      document.getElementById("root").innerHTML = html;
      document.getElementById("headActions").innerHTML = "";
      wireNav();
      document.getElementById("startMonth").onclick = function () {
        var store = A.load();
        A.getMemberPlan(store, member.id)[k] = A.emptyMonth(A.MES[pm]);
        A.save(store);
        A.toast("Mês criado.");
        render();
      };
      return;
    }

    ensureObjIds(d);
    document.getElementById("headActions").innerHTML =
      '<button type="button" class="btn btn-primary" id="savePlanHead">Guardar mês</button>';

    html += '<div class="panel"><h2 class="panel-title">Números de ' + A.MES[pm] + "</h2>" +
      '<div class="metrics-grid">' +
      A.CAMPOS.map(function (f) {
        var v = d.met[f.k];
        return '<div class="field"><label for="met-' + f.k + '">' + A.esc(f.lb) + "</label>" +
          '<input id="met-' + f.k + '" type="number" step="' + (f.dec ? "0.1" : "1") + '" value="' + A.esc(v === "" || v == null ? "" : v) + '"/>' +
          momHint(f, d) + "</div>";
      }).join("") +
      "</div></div>";

    html += '<div class="panel"><h2 class="panel-title">Desafio do mês</h2><div class="form-grid">' +
      '<div class="field span-2"><label for="dz-title">Título</label><input id="dz-title" value="' + A.esc(d.desafio.title) + '"/></div>' +
      '<div class="field span-2"><label for="dz-sub">Subtítulo</label><input id="dz-sub" value="' + A.esc(d.desafio.sub) + '"/></div>' +
      '<div class="field"><label for="dz-flagMain">Bandeira</label><input id="dz-flagMain" value="' + A.esc(d.desafio.flagMain) + '"/></div>' +
      '<div class="field"><label for="dz-flagPrefix">Prefixo</label><input id="dz-flagPrefix" value="' + A.esc(d.desafio.flagPrefix) + '"/></div>' +
      '<div class="field"><label for="dz-flagTarget">Alvo</label><input id="dz-flagTarget" value="' + A.esc(d.desafio.flagTarget) + '"/></div>' +
      '<div class="field"><label for="dz-fill">Progresso da barra</label><input id="dz-fill" value="' + A.esc(d.desafio.fill) + '" placeholder="38.4%"/></div>' +
      "</div></div>";

    html += '<div class="panel"><div class="page-head" style="margin-bottom:10px"><h2 class="panel-title" style="margin:0">Etapas</h2>' +
      '<button type="button" class="btn btn-sm" id="addStage"><i class="fa-solid fa-plus"></i> Etapa</button></div><div class="row-list">';
    (d.desafio.stages || []).forEach(function (st, i) {
      html += '<div class="stage-row">' +
        '<input id="st-name-' + i + '" value="' + A.esc(st.name) + '" aria-label="Nome da etapa"/>' +
        '<input id="st-sub-' + i + '" value="' + A.esc(st.sub || "") + '" aria-label="Subtítulo da etapa"/>' +
        '<select id="st-status-' + i + '" aria-label="Estado da etapa">' + statusOptions(A.STAGE_STATUS, st.status) + "</select>" +
        '<div class="row-actions">' +
          '<button type="button" class="icon-btn" data-stage-up="' + i + '" aria-label="Subir"><i class="fa-solid fa-chevron-up"></i></button>' +
          '<button type="button" class="icon-btn" data-stage-down="' + i + '" aria-label="Descer"><i class="fa-solid fa-chevron-down"></i></button>' +
          '<button type="button" class="icon-btn" data-stage-del="' + i + '" aria-label="Remover etapa"><i class="fa-solid fa-trash"></i></button>' +
        "</div></div>";
    });
    html += "</div></div>";

    html += '<div class="panel"><div class="page-head" style="margin-bottom:10px"><h2 class="panel-title" style="margin:0">Objetivos</h2>' +
      '<button type="button" class="btn btn-sm" id="addObj"><i class="fa-solid fa-plus"></i> Objetivo</button></div><div class="row-list">';
    if (!(d.obj || []).length) html += '<div class="muted">Ainda não há objetivos neste mês.</div>';
    (d.obj || []).forEach(function (o) {
      html += '<div class="obj-row">' +
        '<input id="ob-t-' + A.esc(o.id) + '" value="' + A.esc(o.t) + '" placeholder="Objetivo" aria-label="Texto do objetivo"/>' +
        '<select id="ob-s-' + A.esc(o.id) + '" aria-label="Coluna">' + statusOptions(A.COLS, o.s) + "</select>" +
        '<select id="ob-a-' + A.esc(o.id) + '" aria-label="Aula">' + lessonOptions(o.a) + "</select>" +
        '<div class="row-actions"><button type="button" class="icon-btn" data-obj-del="' + A.esc(o.id) + '" aria-label="Remover objetivo"><i class="fa-solid fa-trash"></i></button></div>' +
      "</div>";
    });
    html += "</div></div>";

    var nTela = (d.tela || []).length;
    if (nTela) {
      html += '<p class="plan-note">Quadro com ' + nTela + " forma" + (nTela === 1 ? "" : "s") + " — visível no portal do membro. Sem editor aqui.</p>";
    }

    html += '<div class="form-actions"><button type="button" class="btn btn-primary" id="savePlan">Guardar mês</button></div>';
    document.getElementById("root").innerHTML = html;
    document.getElementById("savePlanHead").onclick = function () { saveFromDom(); };
    wireNav();
    bind();
  }

  function wireNav() {
    document.getElementById("yearPrev").onclick = function () { py -= 1; render(); };
    document.getElementById("yearNext").onclick = function () { py += 1; render(); };
    document.querySelectorAll(".month-pill").forEach(function (b) {
      b.onclick = function () { pm = +b.getAttribute("data-m"); render(); };
    });
  }

  render();
})();
</script>
</body>
</html>
