<script>(function(){try{var t=localStorage.getItem("nbp-theme")||"dark";var pl=window.matchMedia&&!window.matchMedia("(prefers-color-scheme: dark)").matches;document.documentElement.setAttribute("data-theme",(t==="light"||(t==="system"&&pl))?"light":"dark");}catch(e){}})();</script>
<style>
:root {
  --bg: #151515;
  --bg-surface: #1C1C1C;
  --bg-elev: #222222;
  --border: #C6C8BA1F;
  --border-strong: #C6C8BA33;
  --text: #FDFFEF;
  --text-muted: #94968D;
  --text-subtle: #6B6C63;
  --sage: #C6C8BA;
  --sidebar-w: 244px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "TT Norms Pro", -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }

.app { display: flex; min-height: 100vh; }

.sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg-surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 22px 14px 18px;
  z-index: 100;
}
.sidebar-brand {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 10px 18px; margin-bottom: 6px;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: #2A2926;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-name {
  font-size: 1rem; font-weight: 500;
  letter-spacing: 0.07em;
  color: var(--text);
}
.sidebar-profile {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; border: 1px solid var(--border);
  background: rgba(253, 255, 239, 0.015);
  border-radius: 12px; margin-bottom: 22px;
  transition: border-color 0.25s ease, background 0.25s ease; cursor: pointer;
}
.sidebar-profile:hover {
  border-color: var(--border-strong);
  background: rgba(253, 255, 239, 0.04);
}
.profile-avatar {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, #C6C8BA 0%, #4B4C47 100%);
  color: #181818; font-weight: 700; font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(253, 255, 239, 0.15);
}
.profile-info { min-width: 0; flex: 1; }
.profile-name {
  font-size: 0.88rem; font-weight: 600; color: var(--text);
  line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.profile-plan {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.66rem; font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-muted); margin-top: 3px;
}
.profile-plan::before {
  content: ""; width: 5px; height: 5px; border-radius: 50%;
  background: #C6C8BA; box-shadow: 0 0 6px rgba(198, 200, 186, 0.7);
}
.sidebar-label {
  font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-subtle); padding: 0 12px; margin: 4px 0 10px;
}
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--text-muted); font-size: 0.92rem; font-weight: 500;
  cursor: pointer; position: relative;
  transition: color 0.2s ease, background 0.2s ease;
}
.nav-item i { width: 18px; font-size: 16px; text-align: center; color: inherit; opacity: 0.85; }
.nav-item:hover { color: var(--text); background: rgba(253, 255, 239, 0.04); }
.nav-item.active { color: var(--text); background: rgba(253, 255, 239, 0.06); }
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 18px; border-radius: 2px;
  background: var(--text); box-shadow: 0 0 10px rgba(253, 255, 239, 0.6);
}
.sidebar-footer {
  margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}

.main {
  flex: 1;
  margin-left: var(--sidebar-w);
  padding: 28px 40px 80px;
  min-height: 100vh;
  max-width: 1180px;
}
.topbar {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 22px;
}
.topbar-title { font-size: 1.4rem; font-weight: 600; margin: 0; color: var(--text); }
.topbar-title small {
  display: block; font-size: 0.8rem; font-weight: 400;
  color: var(--text-muted); margin-top: 2px;
}
.topbar-icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg-surface);
  color: var(--text-muted);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}
.topbar-icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-elev); }
.mobile-toggle { display: none; }

.page { max-width: 640px; }

.featured {
  border: 1px solid var(--border);
  background: var(--bg-surface);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 28px;
}
.featured-row {
  display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
}
.play-lg {
  width: 52px; height: 52px; flex: 0 0 52px; border-radius: 50%;
  background: var(--sage); border: none;
  display: flex; align-items: center; justify-content: center;
  color: #1A1A18; font-size: 16px;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.play-lg:hover { transform: scale(1.04); filter: brightness(1.05); }
.featured-meta {
  margin: 0;
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
}
.badge-week {
  background: rgba(224, 172, 94, 0.14);
  color: #E0AC5E;
  border-radius: 8px;
  padding: 2px 9px;
  font-size: 0.74rem;
  font-weight: 500;
}
.featured-date { font-size: 0.82rem; color: var(--text-muted); }
.featured-title {
  margin: 7px 0 0;
  font-size: 1.15rem;
  font-weight: 600;
  color: var(--text);
  line-height: 1.35;
}
.featured-desc {
  margin: 4px 0 0;
  font-size: 0.88rem;
  color: var(--text-muted);
  line-height: 1.6;
}
.wave {
  display: flex; align-items: flex-end; gap: 3px;
  height: 32px; margin-top: 16px;
}
.wave span {
  width: 3px; border-radius: 2px;
  background: #3A3934;
  display: block;
}

.section-title {
  margin: 0 0 12px;
  font-size: 1rem;
  font-weight: 600;
  color: var(--text);
}

.talk-card {
  display: flex; gap: 14px; align-items: center;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  border-radius: 12px;
  padding: 13px;
  margin-bottom: 9px;
  transition: border-color 0.2s ease;
}
.talk-card:hover { border-color: var(--border-strong); }
.play-sm {
  width: 38px; height: 38px; flex: 0 0 38px; border-radius: 50%;
  border: 1px solid var(--border-strong);
  background: transparent;
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease;
}
.play-sm:hover {
  border-color: var(--sage);
  background: rgba(198, 200, 186, 0.08);
  color: var(--sage);
}
.talk-body { min-width: 0; flex: 1; }
.talk-title {
  margin: 0; font-size: 0.92rem; font-weight: 600; color: var(--text);
}
.talk-meta {
  margin: 3px 0 0; font-size: 0.82rem; color: var(--text-muted);
}
.wave-sm {
  display: flex; align-items: flex-end; gap: 2px;
  height: 22px; flex-shrink: 0;
}
.wave-sm span {
  width: 2px; border-radius: 1px;
  background: #3A3934;
  display: block;
}

.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 90; border: 0; padding: 0; cursor: pointer;
}
.sidebar-backdrop.show { display: block; }

@media (max-width: 860px) {
  .sidebar {
    transform: translateX(-100%);
    transition: transform 0.3s ease;
  }
  .sidebar.open { transform: translateX(0); }
  .main { margin-left: 0; padding: 24px 20px 60px; }
  .mobile-toggle { display: inline-flex !important; }
  .wave-sm { display: none; }
}
</style>
</head>
<body>

<div class="app">
  <button type="button" class="sidebar-backdrop" id="sidebarBackdrop" aria-label="Fechar menu" hidden></button>

  <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
    <div class="sidebar-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" fill="#C6CABE"/><circle cx="10" cy="10" r="6.2" fill="#2A2926"/></svg>
      </span>
      <span class="brand-name">NBP</span>
    </div>

    <a class="sidebar-profile" href="profile.html">
      <div class="profile-avatar">RB</div>
      <div class="profile-info">
        <div class="profile-name">Roque Buarque</div>
        <div class="profile-plan">Membro ativo</div>
      </div>
    </a>

    <div class="sidebar-label">Menu</div>
    <nav class="sidebar-nav" aria-label="Menu">
      <a class="nav-item" href="platform.html">

      <a class="nav-item" href="action-plan.html">

      <a class="nav-item" href="dashboard.html">
        <i class="fa-solid fa-chart-simple" aria-hidden="true"></i>

      </a>
      <a class="nav-item" href="content.html">

  </aside>

  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
      <h1 class="topbar-title">
        Mafra Talks
        <small>O áudio da semana, pelo João Mafra · sexta-feira de manhã</small>
      </h1>
    </div>

    <section class="page" aria-label="Mafra Talks">
      <div id="talksRoot"></div>
    </section>
  </main>
</div>

<script>
(function () {
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  var AU = [
    { t: "O preço não é o problema", d: "21 de agosto", m: "11 min", n: "Porque é que baixar o preço quase nunca resolve o que parece resolver." },
    { t: "Fazer menos, melhor", d: "14 de agosto", m: "9 min", n: "Sobre escolher um canal e ficar lá tempo suficiente." },
    { t: "A conversa que estás a evitar", d: "7 de agosto", m: "14 min", n: "Clientes, sócios, equipa — o custo de adiar." },
    { t: "Consistência não é motivação", d: "31 de julho", m: "8 min", n: "Sistemas em vez de vontade." }
  ];
  var on = [8, 14, 20, 11, 17, 24, 13, 9, 19, 22, 15, 10, 18, 25, 12, 16, 21, 9, 14, 20, 11, 17, 13, 19, 10, 16, 22, 12, 15, 20];

  function waveBars(heights, cls) {
    return '<div class="' + cls + '" aria-hidden="true">' +
      heights.map(function (x) { return '<span style="height:' + x + 'px"></span>'; }).join("") +
      "</div>";
  }

  var cur = AU[0];
  var html =
    '<article class="featured">' +
      '<div class="featured-row">' +
        '<button type="button" class="play-lg" aria-label="Reproduzir">' +
          '<i class="fa-solid fa-play" aria-hidden="true"></i>' +
        "</button>" +
        '<div style="min-width:200px;flex:1">' +
          '<p class="featured-meta">' +
            '<span class="badge-week">esta semana</span>' +
            '<span class="featured-date">' + esc(cur.d) + " · " + esc(cur.m) + "</span>" +
          "</p>" +
          '<p class="featured-title">' + esc(cur.t) + "</p>" +
          '<p class="featured-desc">' + esc(cur.n) + "</p>" +
        "</div>" +
      "</div>" +
      waveBars(on, "wave") +
    "</article>" +
    '<h2 class="section-title">Anteriores</h2>' +
    AU.slice(1).map(function (a) {
      return (
        '<article class="talk-card">' +
          '<button type="button" class="play-sm" aria-label="Reproduzir ' + esc(a.t) + '">' +
            '<i class="fa-solid fa-play" aria-hidden="true"></i>' +
          "</button>" +
          '<div class="talk-body">' +
            '<p class="talk-title">' + esc(a.t) + "</p>" +
            '<p class="talk-meta">' + esc(a.d) + " · " + esc(a.m) + "</p>" +
          "</div>" +
          waveBars(on.slice(0, 16).map(function (x) { return Math.round(x * 0.7); }), "wave-sm") +
        "</article>"
      );
    }).join("");

  document.getElementById("talksRoot").innerHTML = html;

  /* Mobile sidebar */
  var toggle = document.getElementById("mobileToggle");
  var sidebar = document.getElementById("sidebar");
  var backdrop = document.getElementById("sidebarBackdrop");
  function setSidebarOpen(open) {
    if (!sidebar) return;
    sidebar.classList.toggle("open", open);
    if (toggle) toggle.setAttribute("aria-expanded", open ? "true" : "false");
    if (backdrop) {
      backdrop.classList.toggle("show", open);
      backdrop.hidden = !open;
    }
    document.body.style.overflow = open && window.innerWidth <= 860 ? "hidden" : "";
  }
  if (toggle && sidebar) {
    toggle.setAttribute("aria-expanded", "false");
    toggle.addEventListener("click", function (e) {
      e.preventDefault();
      e.stopPropagation();
      setSidebarOpen(!sidebar.classList.contains("open"));
    });
    if (backdrop) backdrop.addEventListener("click", function () { setSidebarOpen(false); });
    document.addEventListener("click", function (e) {
      if (window.innerWidth > 860) return;
      if (!sidebar.classList.contains("open")) return;
      if (sidebar.contains(e.target) || toggle.contains(e.target)) return;
      setSidebarOpen(false);
    });
  }
})();
</script>
</body>
