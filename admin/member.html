<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>NBP · Backoffice — Membro</title>
<meta name="color-scheme" content="dark"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../assets/nbp-admin.css"/>
<script src="../assets/nbp-admin.js"></script>
</head>
<body>
<script>NBPAdmin.requireAuth();</script>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
<div class="app-wrap">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div class="page-head">
      <div>
        <h1 class="page-title" id="pageTitle">Novo membro</h1>
        <p class="page-sub"><a href="members.html">← Membros</a></p>
      </div>
      <div class="page-actions" id="planCta"></div>
    </div>
    <form class="panel" id="form">
      <div class="form-grid">
        <div class="field"><label for="n">Nome</label><input id="n" name="n" required/></div>
        <div class="field"><label for="e">Email</label><input id="e" name="e" type="email" required/></div>
        <div class="field"><label for="empresa">Empresa</label><input id="empresa" name="empresa"/></div>
        <div class="field"><label for="c">Cidade</label><input id="c" name="c"/></div>
        <div class="field">
          <label for="s">Setor</label>
          <select id="s" name="s"></select>
        </div>
        <div class="field"><label for="tel">Telefone</label><input id="tel" name="tel"/></div>
        <div class="field"><label for="ig">Instagram</label><input id="ig" name="ig"/></div>
        <div class="field">
          <label for="plan">Plano</label>
          <select id="plan" name="plan">
            <option value="ativo">Membro ativo</option>
            <option value="inativo">Inativo</option>
          </select>
        </div>
        <div class="field">
          <label for="papel">Papel</label>
          <select id="papel" name="papel">
            <option value="cliente">Cliente</option>
            <option value="mentor" disabled>Mentor (em breve)</option>
            <option value="consultora" disabled>Consultora (em breve)</option>
          </select>
        </div>
        <div class="field span-2"><label for="bio">Bio</label><textarea id="bio" name="bio"></textarea></div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a class="btn btn-ghost" href="members.html">Cancelar</a>
        <button type="button" class="btn btn-danger" id="deactivateBtn" hidden>Desativar membro</button>
      </div>
    </form>
  </main>
</div>
</div>
<script>
(function () {
  var A = NBPAdmin;
  A.mountShell("members");
  var isNew = A.param("new") === "1";
  var id = A.param("id");
  var data = A.load();
  var member = id ? A.findById(data.members, id) : null;

  var setor = document.getElementById("s");
  Object.keys(A.SETORES).forEach(function (k) {
    setor.innerHTML += '<option value="' + k + '">' + A.esc(A.SETORES[k]) + "</option>";
  });

  if (!isNew && !member) {
    document.getElementById("pageTitle").textContent = "Membro não encontrado";
    document.getElementById("form").innerHTML = '<p>Este membro já não existe. <a href="members.html">Voltar à lista</a>.</p>';
    return;
  }

  if (member) {
    document.getElementById("pageTitle").textContent = member.n;
    ["n", "e", "empresa", "c", "s", "tel", "ig", "plan", "papel", "bio"].forEach(function (k) {
      var el = document.getElementById(k);
      if (el) el.value = member[k] || "";
    });
    document.getElementById("deactivateBtn").hidden = member.plan !== "ativo";
    document.getElementById("planCta").innerHTML =
      '<a class="btn btn-primary" href="member-plan.html?id=' + encodeURIComponent(member.id) + '">' +
      '<i class="fa-solid fa-flag-checkered" aria-hidden="true"></i> Plano de ação</a>';
  }

  document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault();
    data = A.load();
    var payload = {
      n: document.getElementById("n").value.trim(),
      e: document.getElementById("e").value.trim(),
      empresa: document.getElementById("empresa").value.trim(),
      c: document.getElementById("c").value.trim(),
      s: document.getElementById("s").value,
      tel: document.getElementById("tel").value.trim(),
      ig: document.getElementById("ig").value.trim(),
      plan: document.getElementById("plan").value,
      papel: "cliente",
      bio: document.getElementById("bio").value.trim(),
      g: member && member.g ? member.g : "m"
    };
    if (isNew || !member) {
      payload.id = A.uid("m");
      data.members.unshift(payload);
      A.save(data);
      A.toast("Membro criado.");
      window.location.href = "member.html?id=" + encodeURIComponent(payload.id);
      return;
    }
    var i;
    for (i = 0; i < data.members.length; i++) {
      if (data.members[i].id === member.id) {
        payload.id = member.id;
        data.members[i] = payload;
        break;
      }
    }
    A.save(data);
    A.toast("Alterações guardadas.");
    window.location.reload();
  });

  document.getElementById("deactivateBtn").addEventListener("click", function () {
    A.confirm("O membro deixa de aparecer como ativo no portal (soft). Podes reativar depois.", function () {
      data = A.load();
      var m = A.findById(data.members, member.id);
      if (m) m.plan = "inativo";
      A.save(data);
      A.toast("Membro desativado.");
      window.location.reload();
    });
  });
})();
</script>
</body>
</html>
