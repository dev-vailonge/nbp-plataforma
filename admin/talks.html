<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>NBP · Backoffice — Mafra Talks</title>
<meta name="color-scheme" content="dark"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../assets/nbp-admin.css"/>
<script src="../assets/nbp-admin.js"></script>
</head>
<body>
<script>NBPAdmin.requireAuth();</script>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
<div class="app-wrap">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div class="page-head">
      <div>
        <h1 class="page-title">Mafra Talks</h1>
        <p class="page-sub">O episódio publicado mais recente é o featured do membro.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-primary" id="newTalk"><i class="fa-solid fa-plus" aria-hidden="true"></i> Novo episódio</button>
      </div>
    </div>
    <div id="formPanel" hidden class="panel"></div>
    <div id="root"></div>
  </main>
</div>
</div>
<script>
(function () {
  var A = NBPAdmin;
  A.mountShell("talks");
  var editing = null;

  function formHtml(t) {
    t = t || { t: "", d: "", m: "", n: "", status: "publicado" };
    return '<h2 class="panel-title">' + (t.id ? "Editar episódio" : "Novo episódio") + "</h2>" +
      '<form id="talkForm"><div class="form-grid">' +
      '<div class="field span-2"><label for="tt">Título</label><input id="tt" required value="' + A.esc(t.t) + '"/></div>' +
      '<div class="field"><label for="td">Data</label><input id="td" type="date" value="' + A.esc(t.d) + '"/></div>' +
      '<div class="field"><label for="tm">Duração</label><input id="tm" value="' + A.esc(t.m) + '" placeholder="11 min"/></div>' +
      '<div class="field"><label for="ts">Estado</label><select id="ts">' +
        '<option value="publicado"' + (t.status === "publicado" ? " selected" : "") + ">Esta semana / publicado</option>" +
        '<option value="arquivo"' + (t.status === "arquivo" ? " selected" : "") + ">Arquivo</option>" +
      "</select></div>" +
      '<div class="field span-2"><label for="tn">Blurb</label><textarea id="tn">' + A.esc(t.n) + "</textarea></div>" +
      '</div><div class="form-actions">' +
      '<button type="submit" class="btn btn-primary">Guardar</button>' +
      '<button type="button" class="btn btn-ghost" id="cancelTalk">Cancelar</button>' +
      "</div></form>";
  }

  function openForm(t) {
    editing = t ? t.id : null;
    var panel = document.getElementById("formPanel");
    panel.hidden = false;
    panel.innerHTML = formHtml(t);
    panel.querySelector("#cancelTalk").onclick = function () { panel.hidden = true; editing = null; };
    panel.querySelector("#talkForm").onsubmit = function (e) {
      e.preventDefault();
      var data = A.load();
      var payload = {
        t: document.getElementById("tt").value.trim(),
        d: document.getElementById("td").value,
        m: document.getElementById("tm").value.trim(),
        n: document.getElementById("tn").value.trim(),
        status: document.getElementById("ts").value,
        featured: false
      };
      if (!payload.t) return;
      if (editing) {
        var cur = A.findById(data.talks, editing);
        payload.id = editing;
        payload.featured = !!(cur && cur.featured);
        for (var i = 0; i < data.talks.length; i++) if (data.talks[i].id === editing) data.talks[i] = payload;
      } else {
        payload.id = A.uid("tk");
        data.talks.unshift(payload);
      }
      if (payload.status === "publicado") {
        data.talks.forEach(function (x) { x.featured = x.id === payload.id; });
        payload.featured = true;
      }
      A.save(data);
      panel.hidden = true;
      editing = null;
      A.toast("Episódio guardado.");
      render();
    };
  }

  function render() {
    var data = A.load();
    var list = data.talks.slice().sort(function (a, b) { return (b.d || "").localeCompare(a.d || ""); });
    var feat = A.featuredTalk(data);
    var html = "";
    if (!list.length) html = '<div class="empty">Ainda não há episódios.</div>';
    list.forEach(function (t) {
      var isFeat = feat && feat.id === t.id;
      html += '<article class="talk-card">' +
        '<div class="talk-body"><p class="talk-title">' + A.esc(t.t) + "</p>" +
        '<p class="talk-meta">' + A.esc(A.formatTalkDate(t.d)) + " · " + A.esc(t.m) +
        (isFeat ? ' · <span class="pill pill-week">esta semana</span>' : "") +
        (t.status === "arquivo" ? ' · <span class="pill pill-off">arquivo</span>' : "") +
        "</p></div>" +
        '<button type="button" class="btn btn-sm" data-edit="' + A.esc(t.id) + '">Editar</button>' +
        (t.status === "publicado"
          ? '<button type="button" class="btn btn-sm" data-arch="' + A.esc(t.id) + '">Arquivar</button>'
          : '<button type="button" class="btn btn-sm" data-pub="' + A.esc(t.id) + '">Publicar</button>') +
      "</article>";
    });
    document.getElementById("root").innerHTML = html;
    document.querySelectorAll("[data-edit]").forEach(function (b) {
      b.onclick = function () { openForm(A.findById(A.load().talks, b.getAttribute("data-edit"))); };
    });
    document.querySelectorAll("[data-arch]").forEach(function (b) {
      b.onclick = function () {
        var d = A.load();
        var t = A.findById(d.talks, b.getAttribute("data-arch"));
        if (t) { t.status = "arquivo"; t.featured = false; }
        A.save(d);
        A.toast("Episódio arquivado.");
        render();
      };
    });
    document.querySelectorAll("[data-pub]").forEach(function (b) {
      b.onclick = function () {
        var d = A.load();
        var id = b.getAttribute("data-pub");
        d.talks.forEach(function (t) {
          if (t.id === id) { t.status = "publicado"; t.featured = true; }
          else if (t.featured) t.featured = false;
        });
        A.save(d);
        A.toast("Episódio publicado.");
        render();
      };
    });
  }

  document.getElementById("newTalk").addEventListener("click", function () {
    openForm({ t: "", d: A.ky(new Date()), m: "10 min", n: "", status: "publicado" });
  });

  render();
})();
</script>
</body>
</html>
