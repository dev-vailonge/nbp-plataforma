<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>NBP · Backoffice — Visão geral</title>
<meta name="color-scheme" content="dark"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../assets/nbp-admin.css"/>
<script src="../assets/nbp-admin.js"></script>
</head>
<body>
<script>NBPAdmin.requireAuth();</script>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
<div class="app-wrap">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div class="page-head">
      <div>
        <h1 class="page-title">Visão geral</h1>
        <p class="page-sub">O que a equipa gere para o portal do membro.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn btn-ghost" id="resetBtn">
          <i class="fa-solid fa-rotate-left" aria-hidden="true"></i> Repor dados de exemplo
        </button>
      </div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="panel" id="weekPanel"></div>
  </main>
</div>
</div>
<script>
(function () {
  var A = NBPAdmin;
  A.mountShell("index");

  function render() {
    var data = A.load();
    var ativos = data.members.filter(function (m) { return m.plan === "ativo"; }).length;
    var aulas = data.lessons.length;
    var talks = data.talks.filter(function (t) { return t.status === "publicado"; }).length;
    var nxt = A.nextEvent(data, new Date());
    var nxtLabel = nxt
      ? nxt.event.title + " · " + nxt.date.getDate() + " " + A.MES[nxt.date.getMonth()]
      : "Sem eventos";

    document.getElementById("tiles").innerHTML =
      '<a class="tile" href="members.html"><div class="tile-kicker">Membros ativos</div><div class="tile-value">' + ativos + '</div><div class="tile-hint">' + data.members.length + " no total</div></a>" +
      '<a class="tile" href="content.html"><div class="tile-kicker">Aulas</div><div class="tile-value">' + aulas + '</div><div class="tile-hint">' + data.modules.length + " módulos</div></a>" +
      '<a class="tile" href="talks.html"><div class="tile-kicker">Talks publicados</div><div class="tile-value">' + talks + '</div><div class="tile-hint">Mafra Talks</div></a>' +
      '<a class="tile" href="calendar.html"><div class="tile-kicker">Próximo evento</div><div class="tile-value" style="font-size:1.05rem;padding-top:6px">' + A.esc(nxtLabel) + '</div><div class="tile-hint">Calendário</div></a>';

    var feat = A.featuredTalk(data);
    var weekHtml = '<h2 class="panel-title">A publicar esta semana</h2>';
    if (feat) {
      weekHtml += '<div class="list-row"><div class="grow"><strong>' + A.esc(feat.t) + '</strong><div class="muted">Talk · ' + A.esc(A.formatTalkDate(feat.d)) + " · " + A.esc(feat.m) + '</div></div><a class="btn btn-sm" href="talks.html">Abrir</a></div>';
    } else {
      weekHtml += '<div class="list-row"><div class="grow muted">Nenhum talk publicado.</div></div>';
    }
    if (nxt) {
      weekHtml += '<div class="list-row"><div class="grow"><strong>' + A.esc(nxt.event.title) + '</strong><div class="muted">' + A.esc(nxt.event.sub) + " · " + nxt.date.getDate() + " de " + A.MES[nxt.date.getMonth()] + " · " + A.esc(nxt.event.hour) + '</div></div><a class="btn btn-sm" href="calendar.html">Abrir</a></div>';
    }
    document.getElementById("weekPanel").innerHTML = weekHtml;
  }

  document.getElementById("resetBtn").addEventListener("click", function () {
    A.confirm("Isto substitui todos os dados do backoffice pelos mocks originais.", function () {
      A.reset();
      A.toast("Dados de exemplo repostos.");
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
