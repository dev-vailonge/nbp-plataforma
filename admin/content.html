<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>NBP · Backoffice — Conteúdos</title>
<meta name="color-scheme" content="dark"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<link rel="stylesheet" href="../assets/nbp-admin.css"/>
<script src="../assets/nbp-admin.js"></script>
</head>
<body>
<script>NBPAdmin.requireAuth();</script>
<button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Fechar menu"></button>
<div class="app-wrap">
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navegação"></aside>
  <main class="main">
    <div class="topbar">
      <button class="topbar-icon-btn mobile-toggle" id="mobileToggle" aria-label="Abrir menu">
        <i class="fa-solid fa-bars" aria-hidden="true"></i>
      </button>
    </div>
    <div class="page-head">
      <div>
        <h1 class="page-title">Conteúdos</h1>
        <p class="page-sub">Módulos, tutorias e aulas que o membro vê em Cursos.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn" id="newModBtn"><i class="fa-solid fa-plus" aria-hidden="true"></i> Novo módulo</button>
      </div>
    </div>
    <div id="root"></div>
  </main>
</div>
</div>
<script>
(function () {
  var A = NBPAdmin;
  A.mountShell("content");
  var selected = A.param("module");

  function typeLabel(t) {
    if (t === "tutoria") return "Tutoria";
    if (t === "accountability") return "Accountability";
    return "Curso";
  }

  function render() {
    var data = A.load();
    var html = '<div class="mod-list">';
    data.modules.forEach(function (mod) {
      var ls = A.lessonsFor(data, mod.id);
      var pub = ls.filter(function (l) { return l.status === "publicado"; }).length;
      html += '<a class="mod-card" href="content.html?module=' + encodeURIComponent(mod.id) + '">' +
        '<h3><span class="swatch" style="background:' + A.esc(mod.c || "#453C96") + '"></span> ' + A.esc(mod.t) + "</h3>" +
        '<div class="mod-meta">' + A.esc(mod.sub || typeLabel(mod.type)) + " · " + ls.length + " aulas · " + pub + " publicadas</div>" +
      "</a>";
    });
    html += "</div>";

    if (selected) {
      var mod = A.findById(data.modules, selected);
      if (mod) {
        var lessons = A.lessonsFor(data, mod.id);
        html += '<div class="panel" style="margin-top:18px"><div class="page-head" style="margin-bottom:8px">' +
          "<div><h2 class=\"panel-title\" style=\"margin:0\">" + A.esc(mod.t) + "</h2>" +
          '<p class="page-sub">' + A.esc(mod.sub || "") + "</p></div>" +
          '<a class="btn btn-primary" href="lesson.html?module=' + encodeURIComponent(mod.id) + '&new=1"><i class="fa-solid fa-plus" aria-hidden="true"></i> Nova aula</a>' +
          "</div>";
        if (!lessons.length) html += '<div class="empty">Ainda não há aulas neste módulo.</div>';
        lessons.forEach(function (l) {
          html += '<div class="lesson-row">' +
            '<div class="grow"><strong>' + A.esc(l.t) + '</strong><div class="muted">' + A.esc(l.d || "") + (l.dt ? " · " + A.esc(l.dt) : "") + "</div></div>" +
            '<span class="pill ' + (l.status === "publicado" ? "pill-ok" : "pill-draft") + '">' + (l.status === "publicado" ? "Publicado" : "Rascunho") + "</span>" +
            '<a class="btn btn-sm" href="lesson.html?id=' + encodeURIComponent(l.id) + '">Editar</a>' +
          "</div>";
        });
        html += "</div>";
      }
    }
    document.getElementById("root").innerHTML = html;
  }

  document.getElementById("newModBtn").addEventListener("click", function () {
    A.showModal({
      title: "Novo módulo",
      bodyHtml:
        '<div class="field"><label for="mt">Título</label><input id="mt"/></div>' +
        '<div class="field" style="margin-top:10px"><label for="ms">Subtítulo</label><input id="ms"/></div>' +
        '<div class="field" style="margin-top:10px"><label for="mtype">Tipo</label>' +
        '<select id="mtype"><option value="curso">Curso</option><option value="tutoria">Tutoria</option><option value="accountability">Accountability</option></select></div>',
      okLabel: "Criar",
      onOk: function (box) {
        var t = (box.querySelector("#mt").value || "").trim();
        if (!t) { A.toast("Dá um título ao módulo."); return; }
        var data = A.load();
        var type = box.querySelector("#mtype").value;
        var colors = { curso: ["#453C96", "#CFCBF7"], tutoria: ["#1E4E7E", "#BBD7F4"], accountability: ["#6B4310", "#F3D6A6"] };
        data.modules.push({
          id: A.uid("mod"),
          t: t,
          sub: (box.querySelector("#ms").value || "").trim(),
          type: type,
          c: colors[type][0],
          l: colors[type][1]
        });
        A.save(data);
        A.closeModal();
        A.toast("Módulo criado.");
        render();
      }
    });
  });

  render();
})();
</script>
</body>
</html>
