<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>NBP · Portal do cliente</title>
<style>
:root{--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
 --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
 --hand:'Bradley Hand','Segoe Script','Comic Sans MS',cursive;
 --bg:#111110;--sup:#1A1A18;--sup2:#201F1D;--fill:#2A2926;
 --bd:#302F2C;--bd2:#45443F;--tx:#EDEBE4;--tx2:#A5A39B;--tx3:#77756E;--salvia:#C6CABE}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:var(--sans);color:var(--tx);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
svg.i{width:1em;height:1em;display:block;flex:0 0 auto}

#entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.cartao{width:100%;max-width:380px;background:var(--sup);border:0.5px solid var(--bd);border-radius:14px;padding:32px}
.campo{width:100%;height:40px;border:0.5px solid var(--bd);border-radius:8px;padding:0 12px;font-size:14px;background:var(--sup2);color:var(--tx)}
.campo:focus{outline:none;border-color:var(--salvia);box-shadow:0 0 0 3px rgba(198,202,190,.12)}
.principal{width:100%;height:40px;border:none;border-radius:8px;background:var(--salvia);color:#1A1A18;font-size:14px;font-weight:500}
.principal:hover{background:#D6D9CF}

#app{display:none;padding:22px}
#nx{max-width:1180px;margin:0 auto;background:var(--sup);border:0.5px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;min-height:720px}
.nv:hover{background:var(--sup2)}
.row{display:flex;gap:10px;overflow-x:scroll;padding-bottom:10px;scrollbar-width:thin;scrollbar-color:#45443E #24231F}
.row::-webkit-scrollbar{height:9px;-webkit-appearance:none}
.row::-webkit-scrollbar-track{background:#24231F;border-radius:5px}
.row::-webkit-scrollbar-thumb{background:#45443E;border-radius:5px}
.kcol{border-radius:10px;padding:9px;min-height:150px;background:var(--sup);border:1.5px solid transparent;outline:0.5px solid var(--bd);outline-offset:-1.5px}
.kcol.over{border-color:var(--salvia)}
.kcard{background:var(--sup2);border:0.5px solid var(--bd);border-radius:8px;margin-bottom:7px;display:flex;align-items:flex-start;cursor:grab}
.kcard:hover{border-color:var(--bd2)}
.kcard.drag{opacity:.35}
.kcard .dl{opacity:0}
.kcard:hover .dl{opacity:1}
#tela{position:relative;height:420px;border:0.5px solid var(--bd);border-radius:10px;overflow:hidden;background:#FCFCFA;touch-action:none}
.fr{border:0.5px solid var(--bd);background:var(--sup2);color:var(--tx);border-radius:7px;padding:6px 9px;font-size:13px;display:flex;align-items:center;gap:6px}
.fr:hover{border-color:var(--bd2)}
.fr.on{background:var(--salvia);color:#1A1A18;border-color:var(--salvia)}
.fr:disabled{color:#5C5B55;background:var(--sup)}
#cx{position:absolute;font-family:var(--hand);border:none;border-bottom:1.5px dashed #5DA9F0;outline:none;background:transparent;padding:0}
.pc{position:relative;border:0.5px solid var(--bd);background:var(--sup2);border-radius:9px;overflow:hidden}
.pc:hover,.fo:hover,.fi:hover,.se:hover,.au:hover{border-color:var(--bd2)}
.cam{position:absolute;top:7px;right:7px;width:28px;height:28px;border-radius:50%;border:none;background:rgba(10,10,9,.78);color:var(--salvia);display:flex;align-items:center;justify-content:center;padding:0;opacity:0;font-size:15px}
.pc:hover .cam,.cam:focus{opacity:1}
.pr{display:flex;gap:14px;align-items:flex-start;padding:8px 0}
.pl{flex:0 0 112px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx3);padding-top:2px}
@media(max-width:780px){#nx{flex-direction:column}#rail{width:100%!important;flex:none!important}}
</style>
</head>

<div id="entrada">
  <div class="cartao">
    <div style="display:flex;align-items:center;gap:11px;margin-bottom:26px">
      <span style="width:40px;height:40px;border-radius:9px;background:var(--fill);display:flex;align-items:center;justify-content:center">
        <svg width="21" height="21" viewBox="0 0 20 20" aria-hidden="true"><rect width="20" height="20" fill="#C6CABE"/><circle cx="10" cy="10" r="6.2" fill="#2A2926"/></svg></span>
      <span style="font-size:19px;font-weight:500;letter-spacing:.07em">NBP</span>
    </div>
    <h1 style="margin:0 0 5px;font-size:21px;font-weight:500">Entrar no portal</h1>
    <p style="margin:0 0 22px;font-size:13px;color:var(--tx2);line-height:1.5">Protótipo de demonstração. Qualquer email e palavra-passe servem.</p>
    <label for="em" style="display:block;font-size:12px;color:var(--tx2);margin-bottom:6px">Email</label>
    <input id="em" class="campo" type="email" value="joao@ridgeline.pt" style="margin-bottom:14px" />
    <label for="pw" style="display:block;font-size:12px;color:var(--tx2);margin-bottom:6px">Palavra-passe</label>
    <input id="pw" class="campo" type="password" value="demo1234" style="margin-bottom:6px" />
    <p id="err" style="margin:0 0 14px;font-size:12px;color:#E87070;height:16px"></p>
    <button id="btEntrar" class="principal">Entrar</button>
    <p style="margin:20px 0 0;font-size:12px;color:var(--tx3);line-height:1.6;text-align:center">Os dados são fictícios e não ficam guardados.</p>
  </div>
</div>

<div id="app">
<div id="nx">
<nav id="rail" style="width:200px;flex:0 0 200px;border-right:0.5px solid var(--bd);background:#161615;padding:16px 10px;display:flex;flex-direction:column;gap:2px"></nav>
<main style="flex:1;min-width:0;padding:24px"><div id="conteudo"></div></main>
</div>
</div>
